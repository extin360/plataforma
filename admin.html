<title>JASA Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800;900&family=Barlow+Condensed:wght@600&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: barra lateral fija de secciones + área de trabajo; en celular la barra se vuelve una fila deslizable arriba.
   Una sola apariencia oscura, la misma del sitio público de JASA. */
:root{
  --bg:#0d0d0d; --side:#080808; --panel:#171514; --panel-2:#211d1c; --line:#2f2a28;
  --ink:#f3eeea; --muted:#a8a09b; --faint:#6f6864;
  --red:#e10f0f; --red-2:#ff3b30; --amber:#f2b01e; --green:#5fcf6a; --blue:#7fb2e5; --rose:#ff8a7d;
  --display:'Saira Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px;padding:20px 14px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.brand b{font-family:var(--display);font-weight:900;font-size:34px;line-height:.9;color:var(--red);font-style:italic}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
nav{display:flex;flex-direction:column;gap:2px}
.nav-b{display:flex;align-items:center;justify-content:space-between;gap:8px;background:transparent;color:var(--muted);border:0;border-radius:3px;padding:10px;cursor:pointer;text-align:left;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:17px;letter-spacing:.03em;white-space:nowrap}
.nav-b:hover{background:var(--panel-2);color:var(--ink)}
.nav-b[aria-current="page"]{background:var(--red);color:#fff}
.nav-b .cnt{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--amber)}
.nav-b[aria-current="page"] .cnt{color:#fff}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:12px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
main{min-width:0;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:18px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:rgba(13,13,13,.95);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{margin:0;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:34px;line-height:.95;text-wrap:balance}
h2{margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:22px;letter-spacing:.01em}
.top-act{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:9px 12px;width:260px;max-width:100%}
.content{padding-block:24px 56px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--red);border:0;color:#fff;border-radius:3px;padding:10px 16px;cursor:pointer;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:16px;letter-spacing:.03em;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--red-2)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--panel-2)}
.btn.wa{background:#1f9d55}.btn.wa:hover{background:#25b863}
.btn.sm{padding:6px 10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--red-2);cursor:pointer;font-size:14px;padding:4px;white-space:nowrap}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0}
.box-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--k,var(--line));border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi .v{font-family:var(--display);font-weight:900;font-size:38px;line-height:.9;font-variant-numeric:tabular-nums}
.kpi .n{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 18px}
.row:last-child{border-bottom:0}
button.row{cursor:pointer}button.row:hover{background:var(--panel-2)}
.row .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row .s{font-size:13px;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:2px 8px;white-space:nowrap}
.empty{padding:22px 18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty b{color:var(--ink);font-weight:600}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-align:left;font-weight:500;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.inp{background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:8px 10px;width:100%;min-width:0}
.inp:focus{border-color:var(--muted)}
textarea.inp{resize:vertical;min-height:120px;font-family:var(--mono);font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:3px;padding:6px 12px;cursor:pointer;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:15px}
.tab[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.q-layout{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start}
.q-item{border-left:3px solid transparent}
.q-item[aria-current="true"]{background:var(--panel-2);border-left-color:var(--red)}
.q-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px;padding:16px 18px;border-bottom:1px solid var(--line)}
.q-meta div{display:flex;flex-direction:column;gap:2px;min-width:0}
.q-meta span:last-child{overflow-wrap:anywhere}
.totals{display:flex;flex-direction:column;gap:4px;align-items:flex-end;padding:14px 18px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.totals .big{font-family:var(--display);font-weight:900;font-size:30px}
.actions{display:flex;gap:8px;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line)}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.col{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--k);border-radius:6px;display:flex;flex-direction:column;min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.col-h h2{font-size:18px}
.card{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card:last-child{border-bottom:0}
.card-a{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.bar{height:6px;background:var(--panel-2);border-radius:3px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:28px;height:28px;border:1px solid var(--line);background:var(--panel-2);border-radius:3px;cursor:pointer}
.notice{border:1px solid var(--line);border-left:3px solid var(--amber);background:var(--panel);border-radius:6px;padding:14px 18px;font-size:14px;color:var(--muted)}
.notice b{color:var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--panel);border-left:1px solid var(--line);width:min(460px,100%);height:100%;overflow-y:auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer form{display:flex;flex-direction:column;gap:14px;padding:18px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field small{color:var(--faint);font-size:12px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--rose)}
.sheet-wrap{background:var(--panel-2);padding:14px;overflow:hidden}
.sheet-scale{transform-origin:top left;width:816px}
.sheet{width:816px;background:#ffffff;color:#111111;padding:36px 40px 40px;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.3}
.sheet *{box-sizing:border-box}
.sh-top{display:flex;justify-content:space-between;align-items:center;border:1px solid #444;border-bottom:0;padding:10px 14px}
.sh-logo img{display:block;width:210px;height:auto}
.sh-co{display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:2px;font-weight:700;font-size:11.5px}
.sh-co b{color:#c00000;font-size:16px}
.sh-co .sh-tel{color:#777;font-weight:400}
.sh-row{display:grid;grid-template-columns:1fr 210px;border:1px solid #444;border-bottom:0}
.sh-title{text-align:center;color:#c00000;font-weight:700;font-size:30px;letter-spacing:.02em;padding:8px;border-right:1px solid #444}
.sh-num{display:flex;flex-direction:column;justify-content:center;padding:6px 10px;color:#c00000;font-weight:700;gap:2px}
.sh-num div{display:flex;justify-content:space-between;gap:8px}
.sh-client{margin:0;padding:10px 12px;display:grid;grid-template-columns:72px 1fr;gap:5px 8px;align-items:baseline;border-right:1px solid #444;min-height:120px}
.sh-client dt{color:#999;font-size:10.5px;text-align:right}
.sh-client dd{margin:0;font-size:13px;text-transform:uppercase;min-height:16px;border-bottom:1px solid #eee;overflow-wrap:anywhere}
.sh-cond{padding:8px 10px;font-size:11px;display:flex;flex-direction:column;gap:6px}
.sh-cond div{text-transform:uppercase;overflow-wrap:anywhere;white-space:pre-line}
.sh-table{width:100%;border-collapse:collapse;table-layout:fixed;border:1px solid #444}
.sh-table th{font-family:Arial,Helvetica,sans-serif;background:#fff;color:#c00000;font-weight:400;font-size:11px;border:1px solid #aaa;border-top:2px solid #444;border-bottom:2px solid #444;padding:4px 6px;text-align:center;letter-spacing:0}
.sh-table th:first-child{text-align:left}
.sh-table td{color:#111;border:1px solid #bbb;padding:5px 6px;height:24px;font-size:11.5px;vertical-align:middle}
.sh-table td:nth-child(2){text-transform:uppercase;overflow-wrap:anywhere}
.sh-table td:nth-child(3){text-align:center}
.sh-table td:nth-child(4),.sh-table td:nth-child(5){text-align:right;white-space:nowrap}
.sh-foot{display:grid;grid-template-columns:1fr 210px;border:1px solid #444;border-top:0}
.sh-foot-l{padding:12px 20px;font-size:11px;border-right:1px solid #444;display:flex;flex-direction:column;gap:4px}
.sh-foot-l span{color:#666;font-size:10px}
.sh-tot{padding:8px 10px;display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:12.5px}
.sh-tot div{display:flex;justify-content:space-between;gap:8px}
.sh-tot b{color:#c00000;font-size:12px}
.sh-total{border-top:1px solid #444;padding-top:4px}
.sh-total b{font-size:14px!important}
.hint{font-size:13px;color:var(--muted)}
@media (max-width:1100px){.kanban{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.q-layout{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:static;height:auto;flex-direction:column;gap:10px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line)}
  .brand{flex-direction:row;align-items:baseline;gap:10px;padding:0}
  nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:4px}
  .nav-b{font-size:15px;padding:8px 10px;border:1px solid var(--line)}
  .nav-b[aria-current="page"]{border-color:var(--red)}
  .side-foot{display:none}
  header.top,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  header.top{position:static}
  h1{font-size:28px}
  .search{width:100%}
  .top-act{width:100%}
  .kanban{grid-template-columns:minmax(0,1fr)}
  .f2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside>
    <div class="brand"><b>JASA</b><span class="eyebrow">Administración</span></div>
    <nav id="nav" aria-label="Secciones"></nav>
    <div class="side-foot">
      <span id="syncNote">Conectando…</span>
      <button type="button" class="link" data-act="backup" id="backupBtn" hidden style="text-align:left;padding:0">Descargar respaldo</button>
    </div>
  </aside>
  <main>
    <header class="top">
      <div style="display:flex;flex-direction:column;gap:2px">
        <span class="eyebrow" id="crumb" style="color:var(--red-2)"></span>
        <h1 id="title"></h1>
      </div>
      <div class="top-act">
        <input type="search" id="search" class="search" placeholder="Buscar cliente, folio u orden…" aria-label="Buscar">
        <button type="button" class="btn" data-act="goPaste">+ Pegar solicitud</button>
      </div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>
<div id="drawerRoot"></div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
(function(){
"use strict";
var COLS=["quotes","clientes","proveedores","movs","ordenes","inventario","precios"];
var S={screen:"panel",data:{},ready:{},sel:null,finTab:"todos",finMes:null,search:"",paste:"",pasteMsg:"",drawer:null,confirm:null,readOnly:false,dbState:"loading"};
COLS.forEach(function(c){S.data[c]=[];S.ready[c]=false;});
var db=null, dl=null;

/* ---------- utilidades ---------- */
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function money(n){n=+n||0;return "$"+n.toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});}
function pad(n){return String(n).padStart(2,"0");}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function monthKey(iso){return (iso||"").slice(0,7);}
var MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function monthName(k){if(!k)return "";var p=k.split("-");return MESES[+p[1]-1]+" "+p[0];}
function fmtDate(iso){if(!iso)return "—";var p=iso.split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:iso;}
function fmtMonth(k){if(!k)return "—";var p=k.split("-");return p[1]+"/"+p[0];}
function addMonths(k,n){var p=k.split("-").map(Number);var d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+"-"+pad(d.getMonth()+1);}
function digits(t){return String(t||"").replace(/\D/g,"");}
function waLink(tel,text){var d=digits(tel);if(d.length===10)d="52"+d;return "https://wa.me/"+d+"?text="+encodeURIComponent(text);}
function ago(ts){if(!ts)return "";var m=Math.round((Date.now()-ts)/60000);if(m<1)return "ahora";if(m<60)return "hace "+m+" min";var h=Math.round(m/60);if(h<24)return "hace "+h+" h";var d=Math.round(h/24);return d===1?"ayer":"hace "+d+" días";}
function match(o){var q=S.search.trim().toLowerCase();if(!q)return true;return JSON.stringify(o).toLowerCase().indexOf(q)>=0;}
function byId(c,id){return S.data[c].find(function(x){return x.id===id;});}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true;},2600);}
function quoteTotal(q){return (q.lines||[]).reduce(function(a,l){return a+(parseFloat(l.price)||0)*(+l.qty||0);},0);}
var IVA=0.08;

/* ---------- base de datos ---------- */
function write(c,id,body){
  if(!db){toast("Sin conexión a la base de datos.");return Promise.reject();}
  var ref=id?db.collection(c).doc(id):db.collection(c).doc();
  return ref.set(body).then(function(){return ref.id;},onWriteErr);
}
function patch(c,id,body){if(!db)return Promise.reject();return db.collection(c).doc(id).update(body).catch(onWriteErr);}
function remove(c,id){if(!db)return Promise.reject();return db.collection(c).doc(id).delete().catch(onWriteErr);}
function onWriteErr(e){
  var code=e&&e.code;
  if(code==="invalid_argument"){S.readOnly=true;toast("Tu acceso es de solo lectura.");render();}
  else if(code==="quota_exceeded")toast("La base de datos está llena. Borra registros viejos.");
  else toast("No se guardó. Revisa tu conexión e inténtalo otra vez.");
  throw e;
}
function startDb(){
  var timer=setTimeout(function(){if(S.dbState==="loading"){S.dbState="slow";render();}},10000);
  COLS.forEach(function(c){
    db.collection(c).onSnapshot(function(snap){
      S.data[c]=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o;});
      if(!snap.metadata.fromCache)S.ready[c]=true;
      if(COLS.every(function(k){return S.ready[k];})){S.dbState="ok";clearTimeout(timer);}
      render();
    },function(e){S.dbState=e&&e.code==="revoked"?"revoked":"error";clearTimeout(timer);render();});
  });
}

/* ---------- parseo de la solicitud de WhatsApp (formato del sitio) ---------- */
function parseRequest(txt){
  var get=function(k){var m=txt.match(new RegExp("^"+k+":\\s*(.+)$","m"));return m?m[1].trim():"";};
  var lines=[];txt.split("\n").forEach(function(l){var m=l.trim().match(/^\d+\.\s+(.+?)\s+[—-]\s+(\d+)\s+unidad/);if(m)lines.push({art:m[1],qty:+m[2],price:""});});
  var ci=txt.indexOf("*CONDICIONES*"),cond="";
  if(ci>=0)cond=txt.slice(ci+13).split("\n").map(function(s){return s.trim();}).filter(function(s){return s&&!/^Quedo atento/.test(s);}).join(" · ");
  var f=get("Fecha"),iso="";var m=f.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)iso=m[3]+"-"+pad(m[2])+"-"+pad(m[1]);
  return {folio:get("Número")||("MAN-"+Date.now().toString().slice(-6)),fecha:iso||today(),cliente:get("Cliente")||"Sin nombre",dirigido:get("Dirigido a"),direccion:get("Dirección"),ciudad:get("Ciudad"),rfc:get("RFC"),tel:get("Tel\\."),cond:cond,status:"Nueva",creado:Date.now(),lines:lines};
}

/* ---------- formularios ---------- */
var CAT_ING=["Ventas","Servicios","Capacitación","Otros ingresos"],CAT_EGR=["Insumos","Vehículo","Gastos fijos","Nómina","Impuestos","Otros gastos"];

function openForm(kind,id){
  var rec=id?byId(kind,id):null;
  var def={};
  if(!rec){
    if(kind==="movs")def={tipo:"ingreso",fecha:today(),categoria:"Ventas"};
    if(kind==="ordenes")def={etapa:"0"};
    if(kind==="inventario")def={stock:0,min:0,optimo:0};
  }
  S.drawer={kind:kind,id:id||null,vals:Object.assign({},def,rec||{})};
  if(kind==="ordenes"&&rec)S.drawer.vals.etapa=String(rec.etapa||0);
  renderDrawer();
  setTimeout(function(){var i=document.querySelector("#drawerRoot .inp");if(i)i.focus();},30);
}
function renderDrawer(){
  var root=document.getElementById("drawerRoot");
  if(!S.drawer){root.innerHTML="";return;}
  var d=S.drawer,F=FORMS[d.kind],v=d.vals;
  var fields=F.f.map(function(f){
    var k=f[0],lab=f[1],type=f[2],req=f[3],opts=f[4],hint=f[5],val=v[k]==null?"":v[k],id="f_"+k,ctl;
    if(type==="select")ctl='<select class="inp" id="'+id+'" name="'+k+'">'+opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(String(val)===o[0]?" selected":"")+'>'+esc(o[1])+'</option>';}).join("")+'</select>';

    else ctl='<input class="inp" id="'+id+'" name="'+k+'" type="'+type+'"'+(type==="number"?' step="any" inputmode="decimal"':"")+(req?" required":"")+' value="'+esc(val)+'">';
    return '<div class="field"><label for="'+id+'">'+esc(lab)+(req?" *":"")+'</label>'+ctl+(hint?'<small>'+esc(hint)+'</small>':"")+'</div>';
  }).join("");

    '<div class="box-h"><h2>'+(d.id?"Editar ":"Nuevo ")+esc(F.t)+'</h2><button type="button" class="btn ghost sm" data-act="closeDrawer">Cerrar</button></div>'+

    (d.id?'<button type="button" class="btn ghost" data-act="askDelete">Eliminar</button>':"")+'</div>'+

function submitDrawer(form){
  var d=S.drawer,F=FORMS[d.kind],body={};
  F.f.forEach(function(f){var el=form.elements[f[0]];var x=el.value.trim();if(f[2]==="number")x=x===""?0:(parseFloat(x)||0);body[f[0]]=x;});
  if(d.kind==="ordenes")body.etapa=+body.etapa;
  var p;
  if(d.id){p=patch(d.kind,d.id,body);}
  else{
    if(d.kind==="ordenes"){body.folio=nextOT();body.creado=Date.now();}
    if(d.kind==="quotes"){body.folio="MAN-"+Date.now().toString().slice(-6);body.fecha=today();body.status="Nueva";body.creado=Date.now();body.lines=[];}
    if(d.kind==="clientes")body.desde=today();
    p=write(d.kind,null,body).then(function(id){if(d.kind==="quotes"){S.sel=id;S.screen="quotes";}});
  }
  p.then(function(){S.drawer=null;renderDrawer();toast(d.id?"Cambios guardados":"Agregado");render();},function(){});
}
function nextOT(){var n=S.data.ordenes.reduce(function(a,o){var m=String(o.folio||"").match(/(\d+)/);return m?Math.max(a,+m[1]):a;},0);return "OT-"+String(n+1).padStart(4,"0");}

function normArt(t){return String(t||"").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Z0-9.]+/g," ").trim();}
function priceId(t){var k=normArt(t),h=5381;for(var i=0;i<k.length;i++)h=((h<<5)+h+k.charCodeAt(i))>>>0;return "p"+h.toString(36)+k.length;}
function lookupPrice(art){var id=priceId(art);var r=S.data.precios.find(function(x){return x.id===id;});return r?r.price:null;}
function fillFromList(lines){var n=0;var out=lines.map(function(l){if(l.price===""||l.price==null){var p=lookupPrice(l.art);if(p!=null){n++;return Object.assign({},l,{price:p});}}return l;});return {lines:out,n:n};}
function savePrices(q){
  var ls=(q.lines||[]).filter(function(l){return l.art&&l.price!==""&&l.price!=null;});
  if(!ls.length){toast("Pon precios primero.");return;}
  var chain=Promise.resolve();
  ls.forEach(function(l){chain=chain.then(function(){return write("precios",priceId(l.art),{art:String(l.art).trim().toUpperCase(),price:+l.price,actualizado:today()});});});
  chain.then(function(){toast(ls.length+(ls.length===1?" precio guardado":" precios guardados")+" en tu lista");},function(){});
}

function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();x.fill();}
function drawLogo(){
  var cv=document.createElement("canvas"),K=3;cv.width=440*K;cv.height=200*K;
  var x=cv.getContext("2d");x.scale(K,K);
  x.save();x.translate(10,24);
  x.strokeStyle="#1a1716";x.lineWidth=7;x.lineCap="round";x.beginPath();x.moveTo(30,18);x.lineTo(6,8);x.stroke();
  x.fillStyle="#1a1716";rr(x,26,14,22,20,3);
  x.fillStyle="#E10F0F";x.beginPath();x.moveTo(48,20);x.lineTo(96,6);x.lineTo(96,34);x.lineTo(48,28);x.closePath();x.fill();
  rr(x,10,32,54,120,16);
  x.fillStyle="#ffffff";x.fillRect(10,74,54,16);x.restore();
  x.fillStyle="#1a1716";x.font='600 34px "Barlow Condensed","Arial Narrow",sans-serif';
  if("letterSpacing" in x)x.letterSpacing="7px";x.fillText("EXTINTORES",122,52);if("letterSpacing" in x)x.letterSpacing="0px";

  function jasa(col){x.transform(1,0,Math.tan(-8*Math.PI/180),1,26,0);x.translate(96,176);x.scale(sx,1);x.font=F;x.fillStyle=col;x.fillText("JASA",0,0);}
  x.save();jasa("#E10F0F");x.restore();
  x.save();x.beginPath();x.rect(0,98,440,16);x.clip();jasa("#ffffff");x.restore();

function saveBlob(name,blob){
  if(dl)return dl.save({filename:name,data:blob});
  var u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);return Promise.resolve();

function exportSheet(kind,q){

  if(a==="goPaste"){S.screen="quotes";render();setTimeout(function(){var p=document.getElementById("pasteBox");if(p)p.focus();},20);return;}
  if(a.indexOf("new:")===0){openForm(a.slice(4));return;}

  if(a==="askDelete"){document.getElementById("delConfirm").innerHTML='<div class="confirm">¿Eliminar este registro? No se puede deshacer. <button type="button" class="btn sm" data-act="doDelete">Sí, eliminar</button><button type="button" class="btn ghost sm" data-act="noDelete">Cancelar</button></div>';return;}
  if(a==="noDelete"){document.getElementById("delConfirm").innerHTML="";return;}
  if(a==="doDelete"){var d=S.drawer;remove(d.kind,d.id).then(function(){S.drawer=null;renderDrawer();toast("Eliminado");});return;}
  if(a==="openQuote"){S.sel=id;S.screen="quotes";render();return;}
  if(a==="importPaste"){
    var p=parseRequest(S.paste);
    if(!p.lines.length){S.pasteMsg="No encontré partidas. Pega el mensaje completo, desde *SOLICITUD DE COTIZACIÓN*.";render();return;}
    if(S.data.quotes.some(function(x){return x.folio===p.folio;})){S.pasteMsg="La solicitud "+p.folio+" ya está en la bandeja.";render();return;}
    var pf=fillFromList(p.lines);p.lines=pf.lines;
    write("quotes",null,p).then(function(nid){S.sel=nid;S.paste="";S.pasteMsg="Solicitud "+p.folio+" agregada."+(pf.n?" "+pf.n+(pf.n===1?" precio tomado":" precios tomados")+" de tu lista.":"");render();},function(){});
    return;
  }
  var q=S.sel&&byId("quotes",S.sel);
  if(a==="addLine"&&q){setQuoteLines(q,(q.lines||[]).concat([{art:"",qty:1,price:""}])).then(function(){setTimeout(function(){var ins=document.querySelectorAll('[data-k="art"]');if(ins.length)ins[ins.length-1].focus();},50);});return;}
  if(a==="delLine"&&q){var L=(q.lines||[]).slice();L.splice(+b.getAttribute("data-i"),1);setQuoteLines(q,L);return;}
  if(a==="qStatus"&&q){patch("quotes",q.id,v==="Respondida"?{status:v,respondida:today()}:{status:v}).then(function(){toast("Marcada como "+v.toLowerCase());});return;}
  if(a==="qAccept"&&q&&!q.otFolio){
    var folio=nextOT();
    write("ordenes",null,{folio:folio,cliente:q.cliente,detalle:(q.lines||[]).map(function(l){return l.qty+" × "+String(l.art).toLowerCase();}).join(" · ").slice(0,140),entrega:"",etapa:0,creado:Date.now(),cotizacion:q.folio})
      .then(function(){return patch("quotes",q.id,{status:"Aceptada",otFolio:folio});})
      .then(function(){toast("Orden "+folio+" abierta en Taller");},function(){});
    return;
  }
  if(a==="askDeleteQuote"){document.getElementById("qConfirm").innerHTML='<div class="confirm">¿Eliminar la cotización '+esc(q.folio)+'? <button type="button" class="btn sm" data-act="doDeleteQuote">Sí, eliminar</button><button type="button" class="btn ghost sm" data-act="noDeleteQuote">Cancelar</button></div>';return;}
  if(a==="noDeleteQuote"){document.getElementById("qConfirm").innerHTML="";return;}
  if(a==="doDeleteQuote"&&q){remove("quotes",q.id).then(function(){S.sel=null;toast("Cotización eliminada");render();});return;}
  if(a==="fillPrices"&&q){var f=fillFromList(q.lines||[]);if(!f.n){toast(S.data.precios.length?"No encontré precios guardados para estas partidas.":"Tu lista de precios está vacía. Guarda precios desde una cotización.");return;}setQuoteLines(q,f.lines).then(function(){toast(f.n+(f.n===1?" precio llenado":" precios llenados")+" de tu lista");});return;}
  if(a==="savePrices"&&q){savePrices(q);return;}
  if((a==="sheetPdf"||a==="sheetPng")&&q){exportSheet(a==="sheetPdf"?"pdf":"png",q);return;}
  if(a==="delPrice"){remove("precios",id).then(function(){toast("Precio quitado de tu lista");});return;}
  if(a==="finTab"){S.finTab=v;render();return;}
  if(a==="otMove"){var o=byId("ordenes",id);if(!o)return;var n=Math.max(0,Math.min(3,(o.etapa||0)+(+v)));var up={etapa:n};if(n===3)up.entregado=today();patch("ordenes",id,up);return;}
  if(a==="stock"){var it=byId("inventario",id);if(!it)return;patch("inventario",id,{stock:Math.max(0,(+it.stock||0)+(+v))});return;}
  if(a==="backup"){backup();return;}
});
document.addEventListener("input",function(e){
  if(e.target.id==="search"){S.search=e.target.value;render();}
  if(e.target.id==="pasteBox"){S.paste=e.target.value;}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="finMes"){S.finMes=t.value;render();return;}
  if(t.hasAttribute("data-line")){
    var q=byId("quotes",S.sel);if(!q)return;
    var i=+t.getAttribute("data-line"),k=t.getAttribute("data-k"),L=(q.lines||[]).map(function(l){return Object.assign({},l);});
    if(!L[i])return;
    L[i][k]=k==="qty"?(parseInt(t.value,10)||0):k==="price"?(t.value===""?"":(parseFloat(t.value)||0)):t.value;
    setQuoteLines(q,L);
  }
  if(S.drawer&&t.name==="tipo"){var c=document.getElementById("f_categoria");if(c)c.value=t.value==="ingreso"?"Ventas":"Insumos";}
});
document.addEventListener("submit",function(e){e.preventDefault();if(e.target.id==="drawerForm")submitDrawer(e.target);});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&S.drawer){S.drawer=null;renderDrawer();}});

function backup(){
  if(!dl)return;
  var out={exportado:new Date().toISOString()};COLS.forEach(function(c){out[c]=S.data[c];});
  dl.save({filename:"jasa-respaldo-"+today()+".json",data:JSON.stringify(out,null,2)}).then(function(){toast("Respaldo guardado");},function(e){if(e&&e.code!=="declined")toast("No se pudo descargar el respaldo.");});
}

/* ---------- arranque ---------- */
drawLogo();
if(document.fonts){document.fonts.load('900 150px "Saira Condensed"').then(drawLogo,function(){});document.fonts.load('600 34px "Barlow Condensed"').then(drawLogo,function(){});if(document.fonts.ready)document.fonts.ready.then(function(){drawLogo();fitSheet();});}
render();
if(window.claude&&window.claude.use){
  window.claude.use("db").then(function(d){
    if(!d){S.dbState="nodb";render();return;}
    db=d;startDb();
  },function(){S.dbState="nodb";render();});
  window.claude.use("user").then(function(u){
    if(!u)return;var r=u.can&&u.can("data.write");
    Promise.resolve(r).then(function(ok){if(ok===false){S.readOnly=true;render();}});
  },function(){});
  window.claude.use("downloads").then(function(d){if(d){dl=d;document.getElementById("backupBtn").hidden=false;}},function(){});
}else{S.dbState="nodb";render();}
})();
</script>
