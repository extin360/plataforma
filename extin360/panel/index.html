<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Extin360 · Panel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800;900&family=Barlow+Condensed:wght@600&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<style>
:root{
  --bg:#EEF1F4; --side:#0E1726; --panel:#ffffff; --panel-2:#EEF1F4; --line:#E4E7EC; --line-2:#D0D5DD;
  --ink:#0E1726; --muted:#4A5566; --faint:#8a9ab0; --carbon:#0E1726;
  --red:#E8321F; --red-2:#cf2a18; --verde:#1DB46C; --amber:#8f6100; --amber-f:#f2b01e; --rose:#c0262d;
  --display:'Saira Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
img{max-width:100%}
[hidden]{display:none!important}

/* ── Layout ── */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}

/* ── Sidebar ── */
aside{
  --ink:#ffffff;--muted:#a8b4c4;--faint:#6b7f99;--panel-2:#1a2538;--line:#243040;--red-2:#ff4a35;
  color:var(--ink);background:var(--side);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:20px;padding:20px 14px;
  position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto
}
.brand{display:flex;flex-direction:column;gap:4px;padding:0 8px}
.brand-logo{font-family:var(--display);font-weight:900;font-size:34px;line-height:.9;letter-spacing:-.5px}
.brand-logo span{color:var(--red-2);font-style:italic}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#negocio-name{font-family:var(--mono);font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;padding:0 8px;margin-top:-12px}

nav{display:flex;flex-direction:column;gap:2px}
.nav-sec{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:12px 10px 4px}
.nav-b{display:flex;align-items:center;justify-content:space-between;gap:8px;background:transparent;color:var(--muted);border:0;border-radius:3px;padding:10px;cursor:pointer;text-align:left;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:17px;letter-spacing:.03em;white-space:nowrap;width:100%}
.nav-b:hover{background:var(--panel-2);color:var(--ink)}
.nav-b[aria-current="page"]{background:var(--red);color:#fff}
.nav-b .cnt{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--amber-f)}
.nav-b[aria-current="page"] .cnt{color:#fff}
.nav-b.disabled{opacity:.35;cursor:not-allowed;pointer-events:none}

.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:12px 8px 0;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}
.side-foot button{background:none;border:0;color:var(--faint);cursor:pointer;text-align:left;font-size:12px;padding:4px 2px}
.side-foot button:hover{color:var(--ink)}

/* ── Main ── */
main{min-width:0;display:flex;flex-direction:column}

header.top{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding-block:18px;
  padding-left:max(28px,env(safe-area-inset-left,0px));
  padding-right:max(28px,env(safe-area-inset-right,0px));
  border-bottom:4px solid var(--red);background:rgba(255,255,255,.97);
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5
}
h1{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:34px;line-height:.95;text-wrap:balance}
h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:22px;letter-spacing:.01em}
.top-act{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{background:var(--panel);border:1px solid var(--line-2);border-radius:3px;padding:9px 12px;width:240px;max-width:100%}
.search:focus{outline:2px solid var(--red);outline-offset:2px}

.content{
  padding-block:24px 56px;
  padding-left:max(28px,env(safe-area-inset-left,0px));
  padding-right:max(28px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px
}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--red);border:0;color:#fff;border-radius:3px;padding:10px 16px;cursor:pointer;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:16px;letter-spacing:.03em;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--red-2)}
.btn.ghost{background:var(--panel);border:1px solid var(--line-2);color:var(--ink)}
.btn.ghost:hover{background:var(--panel-2)}
.btn.sm{padding:6px 10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ── KPIs ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--k,var(--line));border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.kpi .v{font-family:var(--display);font-weight:900;font-size:38px;line-height:.9;font-variant-numeric:tabular-nums}
.kpi .n{font-size:13px;color:var(--muted)}

/* ── Box / card ── */
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 2px rgba(14,23,38,.05);overflow:hidden;min-width:0}
.box-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}

/* ── Tabs ── */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{background:var(--panel);border:1px solid var(--line-2);color:var(--ink);border-radius:3px;padding:6px 12px;cursor:pointer;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:15px}
.tab[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}

/* ── Table ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:#ffffff;background:var(--carbon);text-align:left;font-weight:500;padding:9px 14px;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--panel-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── Pills ── */
.pill{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:2px 8px;white-space:nowrap}
.pill-verde{color:var(--verde)}
.pill-amber{color:#a16207}
.pill-rojo{color:var(--red)}
.pill-gray{color:var(--muted)}

/* ── Misc ── */
.mono{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.empty{padding:22px 18px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty b{color:var(--ink);font-weight:600}
.notice{border:1px solid var(--line);border-left:4px solid var(--amber-f);background:var(--panel);border-radius:6px;padding:14px 18px;font-size:14px;color:var(--muted)}
.notice b{color:var(--ink)}
.link{background:none;border:0;color:var(--red-2);cursor:pointer;font-size:14px;padding:4px;white-space:nowrap}

/* ── Drawer ── */
.overlay{position:fixed;inset:0;background:rgba(14,23,38,.45);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--panel);border-left:4px solid var(--red);width:min(480px,100%);height:100%;overflow-y:auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:18px;border-bottom:1px solid var(--line)}
.drawer-head h2{font-size:20px}
.drawer form{display:flex;flex-direction:column;gap:14px;padding:18px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field small{color:var(--faint);font-size:12px}
.inp{background:#ffffff;border:1px solid var(--line-2);border-radius:3px;padding:8px 10px;width:100%;min-width:0}
.inp:focus{border-color:var(--ink);outline:none}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drawer-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;margin-top:auto}
.err-msg{color:var(--red);font-size:13px;padding:0 18px}

/* ── Toast ── */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--carbon);color:#ffffff;padding:10px 16px;border-radius:4px;font-weight:600;z-index:30;max-width:calc(100% - 32px);font-family:var(--mono);font-size:13px}

/* ── Mobile ── */
@media(max-width:720px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;left:-232px;z-index:15;transition:left .2s;height:100%;top:0}
  aside.open{left:0}
  .mob-toggle{display:flex!important}
}
.mob-toggle{display:none;background:none;border:0;padding:8px;cursor:pointer;color:var(--ink)}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-logo">EXTIN<span>360</span></div>
      <div class="eyebrow">Panel de gestión</div>
    </div>
    <div id="negocio-name">—</div>

    <nav>
      <div class="nav-sec">Gestión</div>
      <button class="nav-b" id="nav-extintores" aria-current="page" onclick="mostrarVista('extintores')">
        🧯 Extintores
        <span class="cnt" id="cnt-vencidos" hidden></span>
      </button>
      <button class="nav-b disabled">👥 Clientes</button>
      <button class="nav-b disabled">📋 Órdenes</button>
      <button class="nav-b disabled">📊 Reportes</button>
    </nav>

    <div class="side-foot">
      <span id="email-label">—</span>
      <button onclick="cerrarSesion()">Cerrar sesión →</button>
    </div>
  </aside>

  <!-- Main -->
  <main>
    <!-- Vista: Extintores -->
    <div id="vista-extintores">
      <header class="top">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="mob-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
          <h1>Extintores</h1>
        </div>
        <div class="top-act">
          <input class="search" type="text" placeholder="Buscar serie, tipo, ubicación…" oninput="renderTabla()" id="search">
          <button class="btn" onclick="abrirDrawer(null)">+ Agregar</button>
        </div>
      </header>

      <div class="content">
        <!-- Alerta vencidos -->
        <div class="notice" id="notice-vencer" hidden>
          ⚠️ <b id="notice-txt"></b>
        </div>

        <!-- KPIs -->
        <div class="kpis">
          <div class="kpi" style="--k:var(--carbon)"><div class="v" id="k-total">—</div><div class="n">Total extintores</div></div>
          <div class="kpi" style="--k:var(--verde)"><div class="v" style="color:var(--verde)" id="k-vigentes">—</div><div class="n">Vigentes</div></div>
          <div class="kpi" style="--k:var(--amber-f)"><div class="v" style="color:#a16207" id="k-por-vencer">—</div><div class="n">Por vencer (30 días)</div></div>
          <div class="kpi" style="--k:var(--red)"><div class="v" style="color:var(--red)" id="k-vencidos">—</div><div class="n">Vencidos</div></div>
        </div>

        <!-- Filtros + tabla -->
        <div class="box">
          <div class="box-h">
            <h2 style="font-size:18px">Inventario</h2>
            <div class="tabs">
              <button class="tab" aria-pressed="true"  onclick="setFiltro('todos',this)">Todos</button>
              <button class="tab" aria-pressed="false" onclick="setFiltro('vigente',this)">Vigentes</button>
              <button class="tab" aria-pressed="false" onclick="setFiltro('por-vencer',this)">Por vencer</button>
              <button class="tab" aria-pressed="false" onclick="setFiltro('vencido',this)">Vencidos</button>
            </div>
          </div>
          <div class="tbl-wrap" id="tabla-wrap">
            <div class="empty"><b>Cargando…</b></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Drawer: Agregar / Editar extintor -->
<div class="overlay" id="drawer-overlay" hidden onclick="if(event.target===this)cerrarDrawer()">
  <div class="drawer">
    <div class="drawer-head">
      <h2 id="drawer-title">Agregar extintor</h2>
      <button class="btn ghost sm" onclick="cerrarDrawer()">✕ Cerrar</button>
    </div>
    <form onsubmit="return false">
      <div class="f2">
        <div class="field">
          <label>Número de serie *</label>
          <input class="inp" type="text" id="f-serie" placeholder="EX-001">
        </div>
        <div class="field">
          <label>Tipo *</label>
          <select class="inp" id="f-tipo">
            <option value="">Seleccionar…</option>
            <option>PQS</option>
            <option>CO₂</option>
            <option>Agua</option>
            <option>Espuma</option>
            <option>Halón</option>
            <option>Otro</option>
          </select>
        </div>
      </div>
      <div class="f2">
        <div class="field">
          <label>Capacidad (kg / L)</label>
          <input class="inp" type="text" id="f-capacidad" placeholder="6 kg">
        </div>
        <div class="field">
          <label>Ubicación</label>
          <input class="inp" type="text" id="f-ubicacion" placeholder="Bodega norte">
        </div>
      </div>
      <div class="f2">
        <div class="field">
          <label>Última recarga</label>
          <input class="inp" type="date" id="f-recarga">
        </div>
        <div class="field">
          <label>Vencimiento *</label>
          <input class="inp" type="date" id="f-vencimiento">
        </div>
      </div>
      <div class="field">
        <label>Cliente / responsable</label>
        <input class="inp" type="text" id="f-cliente" placeholder="Empresa o persona">
      </div>
      <div class="field">
        <label>Notas</label>
        <input class="inp" type="text" id="f-notas" placeholder="Observaciones adicionales">
      </div>
    </form>
    <p class="err-msg" id="drawer-err"></p>
    <div class="drawer-foot">
      <button class="btn ghost" onclick="cerrarDrawer()">Cancelar</button>
      <button class="btn" onclick="guardarExtintor()">Guardar</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  var sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
  var negocioId = null;
  var extintores = [];
  var filtroActivo = 'todos';
  var editandoId = null;

  // ── Auth guard — sin loop ───────────────────────────────────────────────────
  sb.auth.getSession().then(async function(r){
    if(!r.data || !r.data.session){
      location.replace('/app'); return;
    }
    var session = r.data.session;
    var email = session.user.email;

    var { data: staff, error } = await sb.from('staff')
      .select('negocio_id, negocios(config)')
      .eq('email', email)
      .eq('activo', true)
      .not('negocio_id', 'is', null)
      .limit(1)
      .maybeSingle();

    if(error || !staff){
      // Sin negocio asignado → mostrar error en lugar de redirigir (evita loop)
      document.querySelector('.app').innerHTML =
        '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px;font-family:Barlow,sans-serif;color:#4A5566">' +
        '<div style="font-size:48px">🧯</div>' +
        '<b style="font-size:1.1rem;color:#0E1726">Sin acceso a negocio</b>' +
        '<p style="font-size:.9rem">Tu cuenta no tiene un negocio asignado. Contacta a Extin360.</p>' +
        '<button onclick="sb_logout()" style="background:#E8321F;color:#fff;border:0;border-radius:3px;padding:10px 20px;cursor:pointer;font-weight:700">Cerrar sesión</button>' +
        '</div>';
      window.sb_logout = async function(){ await sb.auth.signOut(); location.replace('/app'); };
      return;
    }

    negocioId = staff.negocio_id;
    var nombre = (staff.negocios && staff.negocios.config && staff.negocios.config.nombre)
      ? staff.negocios.config.nombre : email;
    document.getElementById('negocio-name').textContent = nombre;
    document.getElementById('email-label').textContent = email;
    cargarExtintores();
  });

  window.cerrarSesion = async function(){
    await sb.auth.signOut();
    location.replace('/app');
  };

  // ── Vista ─────────────────────────────────────────────────────────────────────
  window.mostrarVista = function(nombre){
    document.querySelectorAll('.nav-b').forEach(function(b){ b.removeAttribute('aria-current') });
    document.getElementById('nav-' + nombre).setAttribute('aria-current','page');
  };

  // ── Extintores ────────────────────────────────────────────────────────────────
  async function cargarExtintores(){
    var { data, error } = await sb.from('docs')
      .select('id, data, updated_at')
      .eq('negocio_id', negocioId)
      .eq('col', 'extintores')
      .order('updated_at', { ascending: false });

    if(error){
      document.getElementById('tabla-wrap').innerHTML =
        '<div class="empty"><b>Error al cargar:</b> ' + esc(error.message) + '</div>';
      return;
    }
    extintores = (data || []).map(function(d){ return Object.assign({ _id: d.id }, d.data) });
    actualizarKPIs();
    renderTabla();
  }

  function estadoExtintor(venc){
    if(!venc) return 'sin-fecha';
    var hoy  = new Date(); hoy.setHours(0,0,0,0);
    var date = new Date(venc + 'T00:00:00');
    var diff = Math.round((date - hoy) / 86400000);
    if(diff < 0)   return 'vencido';
    if(diff <= 30) return 'por-vencer';
    return 'vigente';
  }

  function pillEstado(e){
    if(e === 'vencido')    return '<span class="pill pill-rojo">Vencido</span>';
    if(e === 'por-vencer') return '<span class="pill pill-amber">Por vencer</span>';
    if(e === 'vigente')    return '<span class="pill pill-verde">Vigente</span>';
    return '<span class="pill pill-gray">Sin fecha</span>';
  }

  function actualizarKPIs(){
    var total     = extintores.length;
    var vigentes  = extintores.filter(function(e){ return estadoExtintor(e.vencimiento) === 'vigente' }).length;
    var porVencer = extintores.filter(function(e){ return estadoExtintor(e.vencimiento) === 'por-vencer' }).length;
    var vencidos  = extintores.filter(function(e){ return estadoExtintor(e.vencimiento) === 'vencido' }).length;
    document.getElementById('k-total').textContent      = total;
    document.getElementById('k-vigentes').textContent   = vigentes;
    document.getElementById('k-por-vencer').textContent = porVencer;
    document.getElementById('k-vencidos').textContent   = vencidos;

    if(porVencer + vencidos > 0){
      var txt = [];
      if(vencidos > 0)  txt.push(vencidos + ' vencido' + (vencidos > 1 ? 's' : ''));
      if(porVencer > 0) txt.push(porVencer + ' por vencer en 30 días');
      var n = document.getElementById('notice-vencer');
      document.getElementById('notice-txt').textContent = txt.join(' · ') + '. Programa recargas.';
      n.hidden = false;
    }
    var cnt = document.getElementById('cnt-vencidos');
    if(vencidos > 0){ cnt.textContent = vencidos; cnt.hidden = false; }
  }

  window.setFiltro = function(f, btn){
    filtroActivo = f;
    document.querySelectorAll('.tab').forEach(function(b){ b.setAttribute('aria-pressed','false') });
    btn.setAttribute('aria-pressed','true');
    renderTabla();
  };

  window.renderTabla = function(){
    var q = (document.getElementById('search').value || '').toLowerCase();
    var lista = extintores.filter(function(e){
      var estado = estadoExtintor(e.vencimiento);
      if(filtroActivo !== 'todos' && estado !== filtroActivo) return false;
      if(q){
        var h = [(e.serie||''),(e.tipo||''),(e.ubicacion||''),(e.cliente||'')].join(' ').toLowerCase();
        if(!h.includes(q)) return false;
      }
      return true;
    });

    if(lista.length === 0){
      document.getElementById('tabla-wrap').innerHTML =
        '<div class="empty">' +
        (extintores.length === 0
          ? '<b>Sin extintores registrados.</b><span>Agrega el primero con el botón Agregar.</span>'
          : '<b>Sin resultados.</b><span>Prueba con otros filtros o términos de búsqueda.</span>') +
        '</div>';
      return;
    }

    var rows = lista.map(function(e){
      var estado = estadoExtintor(e.vencimiento);
      var vencStr = e.vencimiento
        ? new Date(e.vencimiento + 'T00:00:00').toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'})
        : '—';
      return '<tr class="clickable" onclick="abrirDrawer(\'' + e._id + '\')">' +
        '<td><span class="mono">' + esc(e.serie||'—') + '</span></td>' +
        '<td>' + esc(e.tipo||'—') + '</td>' +
        '<td>' + esc(e.capacidad||'—') + '</td>' +
        '<td>' + esc(e.ubicacion||'—') + '</td>' +
        '<td>' + esc(e.cliente||'—') + '</td>' +
        '<td>' + pillEstado(estado) + '</td>' +
        '<td class="num mono">' + vencStr + '</td>' +
        '</tr>';
    }).join('');

    document.getElementById('tabla-wrap').innerHTML =
      '<table>' +
      '<thead><tr><th>Serie</th><th>Tipo</th><th>Capacidad</th><th>Ubicación</th><th>Cliente</th><th>Estado</th><th class="num">Vencimiento</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
      '</table>';
  };

  // ── Drawer ────────────────────────────────────────────────────────────────────
  window.abrirDrawer = function(id){
    editandoId = id;
    var e = id ? extintores.find(function(x){ return x._id === id }) : null;
    document.getElementById('drawer-title').textContent = e ? 'Editar extintor' : 'Agregar extintor';
    document.getElementById('f-serie').value       = e ? (e.serie||'') : '';
    document.getElementById('f-tipo').value        = e ? (e.tipo||'') : '';
    document.getElementById('f-capacidad').value   = e ? (e.capacidad||'') : '';
    document.getElementById('f-ubicacion').value   = e ? (e.ubicacion||'') : '';
    document.getElementById('f-recarga').value     = e ? (e.recarga||'') : '';
    document.getElementById('f-vencimiento').value = e ? (e.vencimiento||'') : '';
    document.getElementById('f-cliente').value     = e ? (e.cliente||'') : '';
    document.getElementById('f-notas').value       = e ? (e.notas||'') : '';
    document.getElementById('drawer-err').textContent = '';
    document.getElementById('drawer-overlay').hidden = false;
    document.getElementById('f-serie').focus();
  };

  window.cerrarDrawer = function(){
    document.getElementById('drawer-overlay').hidden = true;
  };

  window.guardarExtintor = async function(){
    var serie = document.getElementById('f-serie').value.trim();
    var tipo  = document.getElementById('f-tipo').value;
    var venc  = document.getElementById('f-vencimiento').value;
    var err   = document.getElementById('drawer-err');
    if(!serie){ err.textContent = 'El número de serie es obligatorio.'; return; }
    if(!tipo){  err.textContent = 'Selecciona el tipo de extintor.'; return; }
    if(!venc){  err.textContent = 'La fecha de vencimiento es obligatoria.'; return; }
    err.textContent = '';

    var data = {
      serie:       serie,
      tipo:        tipo,
      capacidad:   document.getElementById('f-capacidad').value.trim(),
      ubicacion:   document.getElementById('f-ubicacion').value.trim(),
      recarga:     document.getElementById('f-recarga').value,
      vencimiento: venc,
      cliente:     document.getElementById('f-cliente').value.trim(),
      notas:       document.getElementById('f-notas').value.trim(),
    };

    var docId = editandoId || serie.toLowerCase().replace(/[^a-z0-9]/g,'-') + '-' + Date.now();

    var { error } = await sb.from('docs').upsert(
      { negocio_id: negocioId, col: 'extintores', id: docId, data: data, updated_at: new Date().toISOString() },
      { onConflict: 'negocio_id,col,id' }
    );

    if(error){ err.textContent = error.message; return; }
    cerrarDrawer();
    mostrarToast(editandoId ? 'Extintor actualizado.' : 'Extintor agregado.');
    cargarExtintores();
  };

  // ── Toast ─────────────────────────────────────────────────────────────────────
  var toastTimer;
  function mostrarToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.hidden = true; }, 3000);
  }

  function esc(s){
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
})();
</script>
</body>
</html>
