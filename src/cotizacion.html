<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/img/icon.svg"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JASA">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0d0d">
<title>Cotización · JASA Extintores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@800;900&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f1ee; --panel:#ffffff; --panel-2:#f6f4f2; --line:#e3ded9; --line-2:#cfc8c2;
  --ink:#1a1716; --muted:#6b6460; --red:#e10f0f; --red-2:#b80c0c; --green:#1e7b34; --green-bg:#e5f3e8; --amber:#f2b01e; --warn:#8f6100;
  --display:'Saira Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0d0d0d}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:#0d0d0d;color:#fff;border-bottom:4px solid var(--red);padding-top:env(safe-area-inset-top,0px)}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;color:#fff}
.brand b{font-family:var(--display);font-weight:900;font-size:32px;line-height:.9;color:var(--red);font-style:italic}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
header .eyebrow{color:#bdb5b0}
main.wrap{padding-block:22px 48px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:0 1px 2px rgba(26,23,22,.05)}
.head{padding:18px 20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;border-bottom:1px solid var(--line)}
h1{margin:0;font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:clamp(28px,6vw,40px);line-height:.95;text-wrap:balance}
h2{margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:22px;line-height:1}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:3px 10px;white-space:nowrap}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px;padding:14px 20px;border-bottom:1px solid var(--line)}
.meta div{display:flex;flex-direction:column;gap:2px;min-width:0}.meta span:last-child{overflow-wrap:anywhere}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:#1a1716;text-align:left;font-weight:500;padding:9px 12px;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tot{display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding:14px 20px;font-variant-numeric:tabular-nums}
.tot .big{font-family:var(--display);font-weight:900;font-size:36px;line-height:1}
.tot .s{color:var(--muted);font-size:14px}
.form{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
label{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.inp{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line-2);border-radius:3px;padding:11px 12px;width:100%;min-width:0}
textarea.inp{min-height:70px;resize:vertical}
.inp:focus{outline:2px solid var(--red);outline-offset:0;border-color:var(--red)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--red);border:0;color:#fff;border-radius:3px;padding:13px 20px;cursor:pointer;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:18px;letter-spacing:.03em;text-decoration:none}
.btn:hover{background:#c40d0d}.btn[disabled]{opacity:.5;cursor:wait}
.btn.wa{background:#1a8a4a}.btn.wa:hover{background:#157a40}
.ok{background:var(--green-bg);color:var(--green);padding:16px 20px;font-weight:600}
.err{color:var(--red-2);font-size:14px;min-height:1.2em}
.note{color:var(--muted);font-size:14px}
.foot{color:var(--muted);font-size:13px}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (max-width:540px){th:nth-child(1),td:nth-child(1),th:nth-child(4),td:nth-child(4){display:none}td,th{padding-inline:10px}.btns .btn{flex:1 1 100%}}
</style>
</head>
<body>
<header><div class="wrap"><a class="brand" href="/"><b data-emp="etqMarca">JASA</b><span class="eyebrow">Cotización</span></a><span class="eyebrow" data-emp="lugar">Piedras Negras, Coahuila</span></div></header>
<main class="wrap" id="out"><p class="note">Abriendo tu cotización…</p></main>
<form name="cotizacion-autorizada" data-netlify="true" netlify-honeypot="bot-field" hidden aria-hidden="true"><input name="bot-field"><input name="subject"><input name="folio"><input name="cliente"><input name="autorizo"><textarea name="comentario"></textarea><input name="total"><input name="ver_cotizacion"></form>
<div class="wrap foot" style="padding-bottom:24px"><span data-emp="razon">JASA EXTINTORES SA DE CV</span> · <span data-emp="dir">Mutualista 412, Col. Buena Vista Sur, Piedras Negras, Coahuila</span> · <span data-emp="contacto">878 783 3216 · WhatsApp 878 117 4728</span></div>
<script>
/*@reporte*/
/*@/reporte*/
</script>
<script src="/config.js"></script>
<script>
(function(){
var IVA=jasaIva();
jasaEmpresaPintar();jasaEmpresaCargar(SUPA_URL,SUPA_KEY,function(){IVA=jasaIva();jasaEmpresaPintar();if(Q)render();});
var $=function(i){return document.getElementById(i);};
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function money(n){return "$"+(+n||0).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});}
function fd(s){if(!s)return "";var p=String(s).slice(0,10).split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:s;}
var token=(decodeURIComponent(location.pathname).split("/q/")[1]||"").split("/")[0];if(!token||/^index\.html?$/i.test(token))token=location.hash.slice(1);
token=token.replace(/[^A-Za-z0-9_-]/g,"");
function rpc(fn,body){return fetch(SUPA_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"apikey":SUPA_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j&&j.message||"error");return j;});});}
var Q=null;
function render(){
  var q=Q,lines=q.lines||[],sub=lines.reduce(function(a,l){return a+(parseFloat(l.price)||0)*(+l.qty||0);},0),tot=sub*(1+IVA);
  var aut=q.status==="Autorizada"||q.status==="Aceptada",rech=q.status==="Rechazada",missing=lines.some(function(l){return l.price===""||l.price==null;});
  var wa=jasaWaLink("Hola, tengo una duda sobre la cotización "+q.folio+" de "+q.cliente+".");
  $("out").innerHTML='<div class="card"><div class="head"><div><span class="eyebrow">Cotización '+esc(q.folio)+' · '+esc(fd(q.fecha))+'</span><h1>'+esc(q.cliente)+'</h1></div><span class="pill" style="color:'+(aut?"var(--green)":rech?"var(--red-2)":"var(--warn)")+'">'+(aut?"Autorizada":rech?"No vigente":"Por autorizar")+'</span></div>'+
    '<div class="meta">'+[["Dirigido a",q.dirigido],["Dirección",[q.direccion,q.ciudad].filter(Boolean).join(", ")],["Condiciones",q.cond],["Tiempo de entrega",q.entregaTxt],["Vigencia de precios",q.vigencia]].filter(function(m){return m[1];}).map(function(m){return '<div><span class="eyebrow">'+m[0]+'</span><span>'+esc(m[1])+'</span></div>';}).join("")+'</div>'+
    '<div class="tbl"><table><thead><tr><th>#</th><th>Concepto</th><th class="n">Cant.</th><th class="n">Precio unit.</th><th class="n">Importe</th></tr></thead><tbody>'+lines.map(function(l,i){var has=l.price!==""&&l.price!=null;return '<tr><td>'+(i+1)+'</td><td>'+esc(l.art)+'</td><td class="n">'+esc(l.qty)+'</td><td class="n">'+(has?money(l.price):"—")+'</td><td class="n">'+(has?money((parseFloat(l.price)||0)*(+l.qty||0)):"—")+'</td></tr>';}).join("")+'</tbody></table></div>'+
    '<div class="tot"><span class="s">Subtotal '+money(sub)+' · I.V.A. '+JASA_EMPRESA.iva+'% '+money(sub*IVA)+'</span><span class="big">'+money(tot)+'</span><span class="s">Precios en pesos mexicanos</span></div></div>'+
    (aut?'<div class="card"><div class="ok">Autorizada por '+esc((q.autorizo||{}).nombre||"el cliente")+((q.autorizo||{}).fecha?' el '+esc(fd(q.autorizo.fecha))+' a las '+esc(String(q.autorizo.fecha).slice(11,16)):"")+'. Ya nos llegó el aviso; te contactamos para programar el servicio.</div></div>'
    :rech?'<div class="card"><div class="form"><b>Esta cotización ya no está vigente.</b><span class="note">Escríbenos y te mandamos una nueva.</span><div class="btns"><a class="btn wa" target="_blank" rel="noopener" href="'+esc(wa)+'">Escribir por WhatsApp</a></div></div></div>'
    :missing?'<div class="card"><div class="form"><b>Estamos terminando tu cotización.</b><span class="note">Algunos precios todavía no están listos. Te avisamos en cuanto la completemos.</span></div></div>'
    :'<form class="card" id="autForm"><div class="form"><h2>Autorizar cotización</h2><span class="note">Al autorizar nos llega el aviso y te contactamos para programar la recolección o el servicio.</span>'+
      '<div class="field"><label for="aNom">Tu nombre</label><input class="inp" id="aNom" autocomplete="name" required value="'+esc(q.dirigido||"")+'"></div>'+
      '<div class="field"><label for="aCom">Comentarios (opcional)</label><textarea class="inp" id="aCom" placeholder="Ej. Pueden pasar el lunes por la mañana; preguntar por Laura"></textarea></div>'+
      '<div class="err" id="aErr" role="alert"></div><div class="btns"><button class="btn" type="submit" id="aBtn">Autorizar cotización</button><a class="btn wa" target="_blank" rel="noopener" href="'+esc(wa)+'">Tengo dudas</a></div></div></form>');
}
function aviso(q,nombre,com){
  try{var lines=q.lines||[],sub=lines.reduce(function(a,l){return a+(parseFloat(l.price)||0)*(+l.qty||0);},0);
    var body=new URLSearchParams({"form-name":"cotizacion-autorizada",subject:"Cotización autorizada "+q.folio+": "+q.cliente,folio:q.folio,cliente:q.cliente,autorizo:nombre,comentario:com||"",total:money(sub*(1+IVA)),ver_cotizacion:"https://jasaextintores.com/admin/#cotizacion-"+q.folio});
    fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body.toString()}).catch(function(){});}catch(e){}
}
document.addEventListener("submit",function(e){if(e.target.id!=="autForm")return;e.preventDefault();
  var n=$("aNom").value.trim(),c=$("aCom").value.trim(),b=$("aBtn");if(n.length<3){$("aErr").textContent="Escribe tu nombre para autorizar.";$("aNom").focus();return;}
  b.disabled=true;$("aErr").textContent="";
  rpc("autorizar_cotizacion",{token:token,nombre:n,comentario:c}).then(function(){aviso(Q,n,c);return rpc("cotizacion_publica",{token:token});}).then(function(q){Q=q;render();window.scrollTo(0,0);},
    function(err){b.disabled=false;$("aErr").textContent=(err&&err.message&&!/fetch|network/i.test(err.message)?err.message:"No se pudo enviar. Revisa tu conexión e inténtalo otra vez.");});});
if(token.length<20){$("out").innerHTML='<div class="card"><div class="form"><b>Este enlace no está completo.</b><span class="note">Ábrelo directo desde el mensaje que te mandamos, o escríbenos al '+esc(JASA_EMPRESA.wa)+'.</span></div></div>';return;}
rpc("cotizacion_publica",{token:token}).then(function(q){if(!q){$("out").innerHTML='<div class="card"><div class="form"><b>No encontramos esta cotización.</b><span class="note">Pide el enlace otra vez por WhatsApp al '+esc(JASA_EMPRESA.wa)+'.</span></div></div>';return;}Q=q;render();},
  function(){$("out").innerHTML='<div class="card"><div class="form"><b>No se pudo abrir la cotización.</b><span class="note">Revisa tu conexión y vuelve a intentar.</span></div></div>';});
})();
</script>
</body>
</html>
