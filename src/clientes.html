<style>
/* Portal: una sola columna de lectura; arriba quién eres y cuándo te toca recarga, abajo tus equipos y tus reportes */
:root{
  --bg:#f3f1ee; --panel:#ffffff; --panel-2:#f3f1ee; --line:#e3ded9; --line-2:#cfc8c2;
  --ink:#1a1716; --muted:#6b6460; --faint:#8a827d; --carbon:#1a1716;
  --red:#e10f0f; --red-2:#b80c0c; --amber:#8f6100; --amber-f:#f2b01e; --green:#1e7b34; --rose:#c0262d; --blue:#1d5fa8;
  --display:'Saira Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{--ink:#ffffff;--muted:#bdb5b0;--faint:#8f8782;--line:#2b2725;--panel-2:#1f1b1a;--red-2:#ff3b30;--amber:#f2b01e;--green:#5fcf6a;color:#ffffff;background:#0d0d0d;border-bottom:4px solid var(--red)}
header .btn.ghost{background:transparent;border:1px solid #5a524e;color:#ffffff}
header .btn.ghost:hover{background:#1f1b1a}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none}
.brand b{font-family:var(--display);font-weight:900;font-size:32px;line-height:.9;color:var(--red);font-style:italic}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
main .wrap{padding-block:28px 64px;display:flex;flex-direction:column;gap:20px}
h1,h2{margin:0;font-family:var(--display);text-transform:uppercase;line-height:.95;text-wrap:balance}
h1{font-size:clamp(34px,7vw,52px);font-weight:900}
h2{font-size:22px;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--red);border:0;color:#fff;border-radius:3px;padding:12px 18px;cursor:pointer;font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:17px;letter-spacing:.03em;text-decoration:none;white-space:nowrap}
.btn:hover{background:#c40d0d}
.btn.ghost{background:var(--panel);border:1px solid var(--line-2);color:var(--ink)}
.btn.ghost:hover{background:var(--panel-2)}
.btn.wa{background:#1a8a4a}
.btn.sm{padding:7px 12px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:wait}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 2px rgba(26,23,22,.05);overflow:hidden}
.box-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.login{max-width:440px;display:flex;flex-direction:column;gap:14px;padding:24px}
.login p{margin:0;color:var(--muted)}
.code{font-family:var(--mono);font-size:24px;letter-spacing:.12em;text-transform:uppercase;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:12px 14px;width:100%;text-align:center}
.code:focus{border-color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.check input{width:18px;height:18px;accent-color:var(--red)}
.err{color:var(--rose);font-size:14px;min-height:1.3em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--k,var(--line));border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--display);font-weight:900;font-size:34px;line-height:.95;font-variant-numeric:tabular-nums}
.kpi .n{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:#ffffff;background:var(--carbon);text-align:left;font-weight:500;padding:9px 16px;white-space:nowrap}
td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.ord{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.ord:last-child{border-bottom:0}
.ord .s{font-size:14px;color:var(--muted)}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:2px 8px;white-space:nowrap;margin-left:8px;vertical-align:middle}
.empty{padding:20px 18px;color:var(--muted)}
.foot{color:var(--faint);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.modal.pdfv{flex-direction:column;align-items:stretch;justify-content:flex-start;padding:0;background:#3d3633;overflow:hidden}
.pv-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top,0px));background:#0d0d0d;color:#fff;border-bottom:3px solid var(--red);font-size:14px}
.pv-bar .btn.ghost{background:transparent;color:#fff;border-color:#5a524e}
.pv-pages{flex:1;min-width:0;min-height:0;width:100%;box-sizing:border-box;overflow:auto;padding:12px;display:flex;flex-direction:column;align-items:center;gap:12px}
.pv-pages.zoom{align-items:flex-start}.pv-pg{cursor:zoom-in}.pv-pages.zoom .pv-pg{cursor:zoom-out}
.pv-pg{flex:none;overflow:hidden;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35)}.pv-in{width:1056px;transform-origin:0 0}
.modal{position:fixed;inset:0;z-index:50;background:rgba(13,13,13,.55);display:flex;justify-content:center;align-items:flex-end;padding:16px 0 0}
.msheet{background:var(--panel);width:min(760px,100%);max-height:100%;overflow:auto;border-radius:10px 10px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.modal{align-items:center;padding:24px}.msheet{border-radius:10px;max-height:90vh}}
.cal{display:grid;grid-template-columns:repeat(var(--n,12),minmax(0,1fr));gap:3px;padding:16px 14px 10px;align-items:end}
.cm{display:flex;flex-direction:column;align-items:center;gap:4px;height:120px;justify-content:flex-end}
.cm i{display:block;width:70%;min-height:3px;background:var(--carbon);border-radius:3px 3px 0 0}.cm.cero i{background:var(--line)}.cm.venc i{background:var(--rose)}
.cm b{font-family:var(--mono);font-size:13px;min-height:1.2em}.cm span{order:3;font-family:var(--mono);font-size:9px;line-height:1.2;text-align:center;text-transform:uppercase;color:var(--muted);white-space:nowrap}.cm.venc span{color:var(--rose)}
@media (max-width:540px){.ord{grid-template-columns:minmax(0,1fr)}.ord.ext{grid-template-columns:minmax(0,1fr) auto}.ord .btn{justify-self:start}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  </section>
  <div id="view" hidden></div>
  <div class="foot"><span><span data-emp="razon">JASA EXTINTORES SA DE CV</span> · <span data-emp="dir">Mutualista 412, Piedras Negras, Coahuila</span></span><span>Tel. <span data-emp="tel">878 783 3216</span></span></div>
</div></main>

<script src="/config.js"></script>
<script>
(function(){
"use strict";
var KEY="jasaPortalCode",DATA=null,CODE="",LOGO="";
var MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
var STAGES=[["Por recoger","#7fb2e5"],["Recibido","#a8a09b"],["En reparación","#f2b01e"],["En entrega","#5fcf6a"],["Entregado","#6f6864"]];
function stg(o){return o.etapaV?(+o.etapa||0):(+o.etapa||0)+1;}
function $(id){return document.getElementById(id);}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return String(n).padStart(2,"0");}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function addM(k,n){var p=k.split("-").map(Number),d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+"-"+pad(d.getMonth()+1);}
function fd(s){if(!s)return "—";var p=s.split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:s;}
function monthName(k){if(!k)return "Sin fecha";var p=k.split("-");return MESES[+p[1]-1]+" "+p[0];}
function tl(t){return t==="CO2"?"CO₂":t==="AGUA"?"Agua":t==="TIPO K"?"Tipo K":t==="TIPO D"?"Tipo D":t==="AGENTE LIMPIO"?"Agente limpio":(t||"");}
function norm(v){var c=String(v||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,10);return c.length>8?c.slice(0,4)+"-"+c.slice(4,8)+"-"+c.slice(8):c.length>4?c.slice(0,4)+"-"+c.slice(4):c;}
function store(k,v){try{if(v)localStorage.setItem(k,v);else localStorage.removeItem(k);}catch(e){}}
function read(k){try{return localStorage.getItem(k)||"";}catch(e){return "";}}

/*@reporte*/
/*@/reporte*/
jasaEmpresaPintar();jasaEmpresaCargar(SUPA_URL,SUPA_KEY,function(){IVA=jasaIva();jasaEmpresaPintar();if(DATA)render();});

(function(){var st=document.createElement("style");st.textContent=JASA_SHEET_CSS;document.head.appendChild(st);})();

function rr(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();x.fill();}
function drawLogo(){
  var cv=document.createElement("canvas"),K=3;cv.width=440*K;cv.height=200*K;var x=cv.getContext("2d");x.scale(K,K);
  x.save();x.translate(10,24);x.strokeStyle="#1a1716";x.lineWidth=7;x.lineCap="round";x.beginPath();x.moveTo(30,18);x.lineTo(6,8);x.stroke();
  x.fillStyle="#1a1716";rr(x,26,14,22,20,3);x.fillStyle="#E10F0F";x.beginPath();x.moveTo(48,20);x.lineTo(96,6);x.lineTo(96,34);x.lineTo(48,28);x.closePath();x.fill();
  rr(x,10,32,54,120,16);x.fillStyle="#ffffff";x.fillRect(10,74,54,16);x.restore();
  x.fillStyle="#1a1716";x.font='600 34px "Barlow Condensed","Arial Narrow",sans-serif';if("letterSpacing" in x)x.letterSpacing="7px";x.fillText("EXTINTORES",122,52);if("letterSpacing" in x)x.letterSpacing="0px";
  var F='900 150px "Saira Condensed","Arial Narrow",Impact,sans-serif';x.font=F;var sx=Math.min(1,300/x.measureText("JASA").width);
  function j(c){x.transform(1,0,Math.tan(-8*Math.PI/180),1,26,0);x.translate(96,176);x.scale(sx,1);x.font=F;x.fillStyle=c;x.fillText("JASA",0,0);}
  x.save();j("#E10F0F");x.restore();x.save();x.beginPath();x.rect(0,98,440,16);x.clip();j("#ffffff");x.restore();
  LOGO=cv.toDataURL("image/png");
}
drawLogo();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawLogo);

function ask(code){
  return fetch(SUPA_URL+"/rest/v1/rpc/portal",{method:"POST",headers:{"apikey":SUPA_KEY,"Content-Type":"application/json"},body:JSON.stringify({codigo:code})})
    .then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.json();});
}
function enter(code,silent){
  var go=$("go");go.disabled=true;$("err").textContent=silent?"":"Buscando…";
  ask(code).then(function(d){
    go.disabled=false;
    if(!d||!d.cliente){$("err").textContent="Ese código no existe o ya no está activo. Revísalo o pide uno nuevo por WhatsApp.";store(KEY,"");if(silent)$("err").textContent="";return;}
    DATA=d;CODE=code;$("err").textContent="";
    if($("remember").checked)store(KEY,code);
    render();
  }).catch(function(){go.disabled=false;$("err").textContent="No pudimos conectarnos. Revisa tu internet e inténtalo otra vez.";});
}
function vigencia(v,cur){return !v?["Sin fecha","var(--muted)"]:v<cur?["Vencido","var(--rose)"]:v<=addM(cur,1)?["Por vencer","var(--amber)"]:["Vigente","var(--green)"];}
function money(n){return "$"+(+n||0).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});}
var IVA=jasaIva(),QST={Enviada:["Por autorizar","var(--amber)"],Autorizada:["Autorizada","var(--green)"],Aceptada:["En proceso","var(--blue)"]};
function render(){
  var c=DATA.cliente||{},ords=DATA.ordenes||[],eq=(c.equiposDet||[]).filter(function(e){return (+e.qty||0)>0;});
  var ext=DATA.extintores||[],insps=DATA.inspecciones||[],cots=DATA.cotizaciones||[],cur=today().slice(0,7);
  var tot=ext.length||eq.reduce(function(a,e){return a+(+e.qty||0);},0);
  var vencidos=ext.filter(function(x){return x.vence&&x.vence<cur;}),prox=ext.map(function(x){return x.vence||"";}).filter(function(v){return v&&v>=cur;}).sort()[0]||"";
  if(!ext.length&&c.proximaRecarga)prox=c.proximaRecarga;
  var proxN=prox?ext.filter(function(x){return x.vence===prox;}).length:0,abiertas=ords.filter(function(o){return stg(o)<4;});
  var k2=vencidos.length?'<div class="kpi" style="--k:var(--rose)"><span class="eyebrow">Recarga vencida</span><span class="v" style="color:var(--rose)">'+vencidos.length+'</span><span class="n">'+(vencidos.length===1?"extintor ya venció":"extintores ya vencieron")+(prox?" · siguiente: "+esc(monthName(prox)):"")+'</span></div>':
    '<div class="kpi" style="--k:'+(!prox?"var(--muted)":prox<=addM(cur,1)?"var(--amber)":"var(--green)")+'"><span class="eyebrow">Próxima recarga</span><span class="v" style="font-size:28px">'+esc(prox?monthName(prox):"Sin fecha")+'</span><span class="n">'+(prox?(proxN?proxN+(proxN===1?" extintor vence ese mes":" extintores vencen ese mes"):"Fecha registrada"):"Te avisamos cuando se registre")+'</span></div>';
  var h='<div><span class="eyebrow">Cliente</span><h1>'+esc(c.nombre)+'</h1></div>'+
    '<div class="kpis"><div class="kpi" style="--k:var(--red)"><span class="eyebrow">Extintores en esta planta</span><span class="v">'+tot+'</span><span class="n">'+(ext.length?(vencidos.length?(ext.length-vencidos.length)+(ext.length-vencidos.length===1?" vigente · ":" vigentes · ")+vencidos.length+(vencidos.length===1?" vencido":" vencidos"):"Todos vigentes"):eq.length?"Según tu último servicio":"Sin equipos registrados")+'</span></div>'+k2+
    '<div class="kpi" style="--k:var(--amber)"><span class="eyebrow">Con nosotros en el taller</span><span class="v">'+abiertas.length+'</span><span class="n">'+(abiertas.length?abiertas.map(function(o){return (STAGES[stg(o)]||STAGES[0])[0].toLowerCase();}).filter(function(v,i,a){return a.indexOf(v)===i;}).join(", "):"Nada pendiente en el taller")+'</span></div></div>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn wa" target="_blank" rel="noopener" href="'+jasaWaLink()+'?text='+encodeURIComponent("Hola, soy de "+(c.nombre||"")+" y quiero agendar la recarga de mis extintores.")+'">Agendar recarga por WhatsApp</a></div>';
  // lo que encontramos en la última inspección
  var extF={};ext.forEach(function(e){extF[e.folio]=e;});
  if(insps[0])insps[0]=Object.assign({},insps[0],{items:(insps[0].items||[]).map(function(x){var e=extF[x.folio];return e&&e.ph!==undefined?Object.assign({},x,{ph:e.ph||""}):x;})});
  var ult=insps[0],hall=ult?jasaHallazgos(ult.items||[],String(ult.fecha||cur).slice(0,7)):[];
  var mkU=ult?String(ult.fecha||cur).slice(0,7):cur,sig=addM(mkU,1),nSig=ult?(ult.items||[]).filter(function(x){return x.vence===sig;}).length:0;
  var msg=function(lista,extra){return "Hola, soy de "+(c.nombre||"")+". Quiero cotizar lo que encontraron en la inspección de "+monthName(mkU)+extra+":\n"+lista.map(function(x){return "• "+x.qty+" × "+x.art;}).join("\n");};
  if(hall.length||nSig){var txt=msg(hall,""),txt2=nSig?msg(jasaHallazgos(ult.items||[],mkU,1),", adelantando también las recargas de "+monthName(sig)):"";
    h+='<div class="box" style="border-left:4px solid var(--amber)"><div class="box-h"><h2>Requiere atención</h2><span class="eyebrow">Inspección de '+esc(monthName(String(ult.fecha).slice(0,7)))+'</span></div><div class="tbl"><table><thead><tr><th class="num">CANT.</th><th>QUÉ HACE FALTA</th></tr></thead><tbody>'+hall.map(function(x){return '<tr><td class="num">'+x.qty+'</td><td>'+esc(x.art.charAt(0)+x.art.slice(1).toLowerCase())+'</td></tr>';}).join("")+'</tbody></table></div><div class="ord" style="border-top:1px solid var(--line)"><span class="s">Incluye los vencidos y los que vencen en '+esc(monthName(mkU))+'. Te mandamos la cotización por WhatsApp o correo.</span><a class="btn sm" target="_blank" rel="noopener" href="'+jasaWaLink()+'?text='+encodeURIComponent(txt)+'">Pedir cotización</a></div>'+
      (nSig?'<div class="ord"><span class="s"><b>'+nSig+(nSig===1?" extintor vence":" extintores vencen")+' en '+esc(monthName(sig))+'.</b> ¿Quieres recargarlos de una vez y evitar otra visita?</span><a class="btn sm ghost" target="_blank" rel="noopener" href="'+jasaWaLink()+'?text='+encodeURIComponent(txt2)+'">Cotizar adelantando</a></div>':"")+'</div>';}
  h+='<div class="box"><div class="box-h"><h2>Reportes de inspección</h2><span class="eyebrow">'+insps.length+'</span></div>'+(insps.length?insps.map(function(it,i){var its=it.items||[],mal=its.filter(function(x){return x.resultado!=="Conforme";}).length;
      return '<div class="ord"><div><b style="font-weight:600">Inspección de '+esc(monthName(String(it.fecha||"").slice(0,7)))+'</b>'+(its.length?'<span class="pill" style="color:'+(mal?"var(--amber)":"var(--green)")+'">'+(mal?mal+" por atender":"Todo conforme")+'</span>':'')+'<div class="s">Revisada el '+fd(it.fecha)+' · '+its.length+(its.length===1?" extintor":" extintores")+(it.reviso?' · Técnico: '+esc(it.reviso):'')+'</div></div>'+
        '<div class="acts"><button type="button" class="btn sm ghost" data-ver="'+i+'">Ver</button><button type="button" class="btn sm" data-insp="'+i+'">PDF</button></div></div>';}).join(""):'<div class="empty">Aún no hay inspecciones registradas. Cuando hagamos tu inspección, el reporte aparece aquí.</div>')+'</div>';
  // calendario de recargas
  if(ext.length){var meses=[];for(var m=0;m<12;m++)meses.push(addM(cur,m));var cnt={};ext.forEach(function(x){if(x.vence)cnt[x.vence<cur?"v":x.vence]=(cnt[x.vence<cur?"v":x.vence]||0)+1;});var mx=Math.max.apply(null,meses.map(function(k){return cnt[k]||0;}).concat([cnt.v||0,1]));
    h+='<div class="box"><div class="box-h"><h2>Calendario de recargas</h2><span class="eyebrow">Próximos 12 meses</span></div><div class="cal" style="--n:'+(12+(cnt.v?1:0))+'">'+(cnt.v?'<div class="cm venc"><span>Venc.</span><i style="height:'+Math.round(cnt.v/mx*100)+'%"></i><b>'+cnt.v+'</b></div>':"")+meses.map(function(k){var n=cnt[k]||0,p=k.split("-");return '<div class="cm'+(n?"":" cero")+'"><span>'+MESES[+p[1]-1].slice(0,3)+'<br>'+(p[1]==="01"||k===cur?"’"+p[0].slice(2):"&nbsp;")+'</span><i style="height:'+Math.round(n/mx*100)+'%"></i><b>'+(n||"")+'</b></div>';}).join("")+'</div><p class="s" style="margin:0;padding:0 18px 14px">Cuántos extintores vencen cada mes. Agenda con tiempo y te los recogemos.</p></div>';}
  if(cots.length)h+='<div class="box"><div class="box-h"><h2>Cotizaciones</h2><span class="eyebrow">'+cots.length+'</span></div>'+cots.map(function(q){var st=QST[q.status]||[q.status,"var(--muted)"],sub=(q.lines||[]).reduce(function(a,l){return a+(parseFloat(l.price)||0)*(+l.qty||0);},0);
      return '<div class="ord"><div><b style="font-weight:600">Cotización '+esc(q.folio)+'</b><span class="pill" style="color:'+st[1]+'">'+esc(st[0])+'</span><div class="s">'+fd(q.fecha)+' · Total '+money(sub*(1+IVA))+'</div></div><a class="btn sm'+(q.status==="Enviada"?"":" ghost")+'" href="/q/'+encodeURIComponent(q.token)+'" target="_blank" rel="noopener">'+(q.status==="Enviada"?"Ver y autorizar":"Ver")+'</a></div>';}).join("")+'</div>';
  if(ext.length){h+='<div class="box"><div class="box-h"><h2>Tus extintores</h2><span class="eyebrow">'+ext.length+'</span></div>'+ext.map(function(x){var st=vigencia(x.vence,cur);
      return '<div class="ord ext"><div><b style="font-weight:600">'+(x.numero?"No. "+esc(x.numero)+" · ":"")+'<span style="font-family:var(--mono);font-size:14px">'+esc(x.folio)+'</span></b><span class="pill" style="color:'+st[1]+'">'+st[0]+'</span><div class="s">'+[x.ubicacion?esc(x.ubicacion):"",esc(tl(x.tipo))+" "+esc(String(x.cap||"").toLowerCase()),x.vence?"Vence "+esc(monthName(x.vence)):""].filter(Boolean).join(" · ")+'</div></div>'+
        '<a class="btn sm ghost" href="/e/'+encodeURIComponent(x.folio)+'" target="_blank" rel="noopener">Ficha</a></div>';}).join("")+'</div>';}
  else h+='<div class="box"><div class="box-h"><h2>Tus extintores</h2></div>'+(eq.length?'<div class="tbl"><table><thead><tr><th>TIPO</th><th>CAPACIDAD</th><th class="num">CANTIDAD</th></tr></thead><tbody>'+eq.map(function(e){return '<tr><td>'+esc(tl(e.tipo))+'</td><td>'+esc(String(e.cap||"").toLowerCase())+'</td><td class="num">'+esc(e.qty)+'</td></tr>';}).join("")+'</tbody></table></div>':'<div class="empty">Aún no tenemos tus equipos registrados.</div>')+'</div>';
  h+='<div class="box"><div class="box-h"><h2>Órdenes de taller</h2><span class="eyebrow">'+ords.length+'</span></div>'+(ords.length?ords.map(function(o,i){var st=STAGES[stg(o)]||STAGES[0];var n=(o.equiposDet||[]).reduce(function(a,e){return a+(+e.qty||0);},0);
      return '<div class="ord"><div><b style="font-weight:600">Orden '+esc(o.folio)+'</b><span class="pill" style="color:'+st[1]+'">'+st[0]+'</span><div class="s">Recibida '+fd(o.recibido)+(stg(o)===4?" · Entregada "+fd(o.entregado):(o.entrega?" · Entrega estimada "+fd(o.entrega):""))+' · '+n+(n===1?" extintor":" extintores")+'</div></div>'+
        '<button type="button" class="btn sm'+(stg(o)===4?"":" ghost")+'" data-i="'+i+'">Reporte PDF</button></div>';}).join(""):'<div class="empty">Todavía no hay órdenes de taller.</div>')+'</div>'+
    '<p class="err" id="pdfMsg" role="status" style="color:var(--muted)"></p>';
  $("view").innerHTML=h;$("view").hidden=false;$("login").hidden=true;$("logout").hidden=false;window.scrollTo(0,0);
}
function verInsp(it){
  if(!$("inspCss")){var st=document.createElement("style");st.id="inspCss";st.textContent=JASA_INSP_CSS;document.head.appendChild(st);}
  var pages=jasaInspeccionPages(Object.assign({cliente:(DATA.cliente||{}).nombre},it),LOGO,DATA.cliente||{});
  var m=document.createElement("div");m.className="modal pdfv";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.setAttribute("aria-label","Reporte de inspección");
  m.innerHTML='<div class="pv-bar"><span>Inspección de '+esc(monthName(String(it.fecha||"").slice(0,7)))+' · '+pages.length+(pages.length===1?" hoja":" hojas")+'<small style="display:block;color:#bdb5b0;font-size:12px">Toca la hoja para acercar o alejar</small></span><span class="acts"><button type="button" class="btn sm" data-insp="'+DATA.inspecciones.indexOf(it)+'">Descargar PDF</button><button type="button" class="btn sm ghost" data-cerrar="1">Cerrar</button></span></div>'+
    '<div class="pv-pages">'+pages.map(function(pg){return '<div class="pv-pg"><div class="pv-in">'+pg+'</div></div>';}).join("")+'</div>';
  PV_ZOOM=false;document.body.appendChild(m);document.body.style.overflow="hidden";ajustaPv();m.querySelector("[data-cerrar]").focus();}
var PV_ZOOM=false;
function ajustaPv(){var w=document.querySelector(".pv-pages");if(!w)return;var fit=Math.min(1,(w.clientWidth-24)/1056),k=PV_ZOOM?Math.min(1,fit*2.4):fit;w.classList.toggle("zoom",PV_ZOOM);
  [].forEach.call(document.querySelectorAll(".pv-pg"),function(pg){pg.style.width=Math.round(1056*k)+"px";pg.style.height=Math.round(816*k)+"px";pg.firstChild.style.transform="scale("+k+")";});}
window.addEventListener("resize",ajustaPv);
function cerrarModal(){var m=document.querySelector(".modal");if(m){m.remove();document.body.style.overflow="";}}
function loadScript(src){return new Promise(function(ok,no){var t=document.createElement("script");t.src=src;t.onload=ok;t.onerror=no;document.head.appendChild(t);});}
var libs=null;
function pdf(o,btn){
  var msg=$("pdfMsg");btn.disabled=true;msg.textContent="Preparando tu reporte…";
  libs=libs||loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js").then(function(){return loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");});
  var holder=document.createElement("div");holder.style.cssText="position:fixed;left:-10000px;top:0;width:816px;background:#fff";
  holder.innerHTML=jasaReportHTML(o,DATA.cliente,LOGO);document.body.appendChild(holder);
  libs.then(function(){return window.html2canvas(holder.firstChild,{scale:2,backgroundColor:"#ffffff",logging:false});}).then(function(cv){
    holder.remove();
    var doc=new window.jspdf.jsPDF({unit:"pt",format:"letter"}),W=612,H=792,r=Math.min(W/cv.width,H/cv.height);
    doc.addImage(cv.toDataURL("image/jpeg",0.92),"JPEG",(W-cv.width*r)/2,0,cv.width*r,cv.height*r);
    doc.save("Reporte-JASA-"+String(o.folio).replace(/[^A-Za-z0-9-]/g,"")+".pdf");
    btn.disabled=false;msg.textContent="Listo. Revisa tus descargas.";
  }).catch(function(){holder.remove();btn.disabled=false;msg.textContent="No se pudo generar el PDF. Inténtalo otra vez.";});
}
function pdfInsp(it,btn){
  var msg=$("pdfMsg");btn.disabled=true;msg.textContent="Preparando tu reporte de inspección…";
  if(!$("inspCss")){var st=document.createElement("style");st.id="inspCss";st.textContent=JASA_INSP_CSS;document.head.appendChild(st);}
  libs=libs||loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js").then(function(){return loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");});
  var holder=document.createElement("div");holder.style.cssText="position:fixed;left:-12000px;top:0;width:1056px;background:#fff";
  holder.innerHTML=jasaInspeccionPages(Object.assign({cliente:(DATA.cliente||{}).nombre},it),LOGO,DATA.cliente||{}).join("");document.body.appendChild(holder);
  libs.then(function(){
    var doc=new window.jspdf.jsPDF({unit:"pt",format:"letter",orientation:"landscape"}),pages=[].slice.call(holder.children),ch=Promise.resolve();
    pages.forEach(function(pg,ix){ch=ch.then(function(){return window.html2canvas(pg,{scale:2,backgroundColor:"#ffffff",logging:false});}).then(function(cv){if(ix)doc.addPage("letter","landscape");doc.addImage(cv.toDataURL("image/jpeg",0.9),"JPEG",0,0,792,612);});});
    return ch.then(function(){holder.remove();doc.save("Inspeccion-"+String(JASA_EMPRESA.etqMarca).replace(/[^A-Za-z0-9]/g,"")+"-"+String(it.fecha||"").replace(/[^0-9-]/g,"")+".pdf");btn.disabled=false;msg.textContent="Listo. Revisa tus descargas.";});
  }).catch(function(){holder.remove();btn.disabled=false;msg.textContent="No se pudo generar el PDF. Inténtalo otra vez.";});
}
$("code").addEventListener("input",function(e){var v=norm(e.target.value);if(v!==e.target.value)e.target.value=v;});
$("form").addEventListener("submit",function(e){e.preventDefault();var c=norm($("code").value);if(c.replace(/-/g,"").length<10){$("err").textContent="El código tiene 10 letras y números, por ejemplo ABCD-EFGH-JK.";return;}enter(c,false);});
$("logout").addEventListener("click",function(){store(KEY,"");DATA=null;$("view").hidden=true;$("view").innerHTML="";$("login").hidden=false;$("logout").hidden=true;$("code").value="";$("code").focus();});
document.addEventListener("keydown",function(e){if(e.key==="Escape")cerrarModal();});
document.addEventListener("click",function(e){if(e.target.closest(".pv-pg")){PV_ZOOM=!PV_ZOOM;ajustaPv();return;}if(e.target.closest("[data-cerrar]")||e.target.classList.contains("modal")){cerrarModal();return;}var bv=e.target.closest("[data-ver]");if(bv&&DATA){verInsp(DATA.inspecciones[+bv.getAttribute("data-ver")]);return;}var bi=e.target.closest("[data-insp]");if(bi&&DATA){pdfInsp(DATA.inspecciones[+bi.getAttribute("data-insp")],bi);return;}var b=e.target.closest("[data-i]");if(b&&DATA)pdf(DATA.ordenes[+b.getAttribute("data-i")],b);});
var hc=norm(decodeURIComponent(location.hash.slice(1)));if(hc.replace(/-/g,"").length===10){try{history.replaceState(null,"",location.pathname);}catch(e){}$("code").value=hc;enter(hc,false);}else{var saved=read(KEY);if(saved){$("code").value=saved;enter(saved,true);}}
})();
</script>
