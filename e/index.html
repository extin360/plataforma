ul{margin:0;padding-left:18px}

.foot{color:var(--muted);font-size:13px}

/* Folios: PREFIJO-NNN por cliente (ej. EAP1-001) o JX-000001 para etiquetas en blanco. */
function jasaFolio(txt) {
  var s = String(txt || "").toUpperCase().trim();
  var m = s.match(/\/E\/([A-Z0-9]{2,8})-(\d{1,6})/) || s.match(/^([A-Z0-9]{2,8})-(\d{1,6})$/) || s.match(/\b(JX)-?(\d{1,6})\b/);
  if (!m) return "";
  return m[1] + "-" + m[2].padStart(m[1] === "JX" ? 6 : 3, "0");
}
function jasaPrefijo(nombre) {
  var stop = { DE: 1, DEL: 1, LA: 1, LAS: 1, LOS: 1, EL: 1, Y: 1, SA: 1, CV: 1, "S.A.": 1, "C.V.": 1, SAPI: 1, SC: 0 };
  var w = String(nombre || "").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Z0-9 ]+/g, " ").split(/\s+/).filter(function (x) { return x && !stop[x]; });
  var dig = w.filter(function (x) { return /^\d+$/.test(x); }).join("").slice(0, 2), pal = w.filter(function (x) { return !/^\d+$/.test(x); });
  var p = pal.length >= 2 ? pal.slice(0, 3).map(function (x) { return x[0]; }).join("") : (pal[0] || "CLI").slice(0, 3);
  return (p + dig).slice(0, 6) || "CLI";
}

    if (i.vencido || /recarga|vencido|despresurizado/i.test(ch)) add(JASA_CATS[0], "RECARGA DE EXTINTOR " + eq);
    if (i.ph && i.ph < hoyMes) add(JASA_CATS[0], "PRUEBA HIDROSTÁTICA DE EXTINTOR " + eq);

/* ---------- asistencia (panel y app) ---------- */
function jasaHM(min) { min = Math.max(0, Math.round(min || 0)); return Math.floor(min / 60) + ":" + String(min % 60).padStart(2, "0"); }
function jasaIso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function jasaLunes(fecha) { var d = new Date(fecha + "T12:00:00"); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return jasaIso(d); }
function jasaSemana(lunes) { var out = [], d = new Date(lunes + "T12:00:00"); for (var i = 0; i < 7; i++) { out.push(jasaIso(d)); d.setDate(d.getDate() + 1); } return out; }
var JASA_DIAS = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
// Empareja entradas y salidas de cada persona y suma las horas por día.
function jasaAsistCalc(marcas, desde, hasta, hoy) {
  var per = {};
  (marcas || []).filter(function (m) { return m.fecha >= desde && m.fecha <= hasta; }).slice().sort(function (a, b) { return String(a.t).localeCompare(String(b.t)); }).forEach(function (m) {
    var em = String(m.email || "").toLowerCase(), p = per[em] = per[em] || { email: em, nombre: m.nombre || em.split("@")[0], dias: {}, total: 0, alertas: [], abierto: null };
    var dia = p.dias[m.fecha] = p.dias[m.fecha] || { min: 0, marcas: [] }; dia.marcas.push(m);
    if (m.tipo === "entrada") { if (p.abierto) p.alertas.push({ fecha: p.abierto.fecha, txt: "Entrada de las " + p.abierto.hora + " sin salida" }); p.abierto = m; return; }
    if (!p.abierto) { p.alertas.push({ fecha: m.fecha, txt: "Salida de las " + m.hora + " sin entrada" }); return; }
    var min = (new Date(m.t) - new Date(p.abierto.t)) / 60000, d0 = p.dias[p.abierto.fecha];
    if (min > 16 * 60) p.alertas.push({ fecha: p.abierto.fecha, txt: "Turno de más de 16 horas (" + jasaHM(min) + ")" });
    d0.min += min; p.total += min; p.abierto = null;
  });
  Object.keys(per).forEach(function (k) { var p = per[k]; if (p.abierto && p.abierto.fecha !== hoy) { p.alertas.push({ fecha: p.abierto.fecha, txt: "Entrada de las " + p.abierto.hora + " sin salida" }); p.abierto = null; } });
  return per;
}
// Pide la ubicación del teléfono y marca en el servidor (Supabase: public.marcar_asistencia).
function jasaMarcar(sb, tipo) {
  if (!navigator.geolocation) return Promise.resolve({ ok: false, msg: "Este dispositivo no puede compartir su ubicación." });
  return new Promise(function (ok) {
    navigator.geolocation.getCurrentPosition(function (pos) { ok(pos); }, function (e) { ok({ err: e && e.code }); }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  }).then(function (pos) {
    if (pos.err === 1) return { ok: false, msg: "Activa la ubicación para marcar. En iPhone: Ajustes › Privacidad y seguridad › Localización › Safari (o Chrome) › Al usar la app, con Ubicación exacta encendida. En Android: toca el candado junto a la dirección › Permisos › Ubicación." };
    if (pos.err) return { ok: false, msg: "No se pudo obtener tu ubicación. Revisa que la ubicación (GPS) del teléfono esté encendida y vuelve a intentar." };
    var c = pos.coords, dev = (navigator.userAgent.match(/iPhone|iPad|Android|Windows|Macintosh/) || [""])[0];
    return sb.rpc("marcar_asistencia", { tipo: tipo, lat: c.latitude, lng: c.longitude, precision_m: c.accuracy, dispositivo: dev }).then(function (r) {
      if (r.error) return { ok: false, msg: /marcar_asistencia|PGRST202|404/.test(String(r.error.message) + r.error.code) ? "Falta instalar la asistencia en Supabase (09_asistencia.sql)." : "No se pudo marcar: " + r.error.message };
      var d = r.data || {};
      if (d.ok) return { ok: true, msg: (tipo === "entrada" ? "Entrada" : "Salida") + " registrada a las " + d.hora + ".", hora: d.hora };
      return { ok: false, msg: {
        fuera: "Estás a " + Number(d.distancia || 0).toLocaleString("es-MX") + " m del negocio. Para marcar tienes que estar a menos de " + d.radio + " m.",
        precision: "Tu ubicación no es precisa (±" + d.precision + " m). Activa la ubicación exacta, espera unos segundos y vuelve a intentar.",
        sin_negocio: "Falta fijar la ubicación del negocio. La fija un administrador en el panel › Asistencia.",
        repetido: "Ya marcaste tu " + tipo + " hoy a las " + d.hora + ".",
        sin_acceso: "Tu correo no está en la lista de personal."
      }[d.motivo] || "No se pudo marcar." };
    }, function () { return { ok: false, msg: "Sin conexión. Vuelve a intentar cuando tengas señal." }; });
  });
}
