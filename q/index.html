  var iva = 0, gi = imp ? xml.lastIndexOf(imp) : -1;
  if (gi >= 0) { var fin = xml.indexOf("Impuestos>", gi + imp.length), sec = xml.slice(gi, fin < 0 ? undefined : fin), rt = /<(?:[A-Za-z0-9_]+:)?Traslado(?=[\s/>])([^>]*)>/g, mt;
    while ((mt = rt.exec(sec))) if (at(mt[1], "Impuesto") === "002") iva += num(at(mt[1], "Importe")); }
  var pagos = tipo === "P" ? tags("Pago").map(function (s) { return { fecha: at(s, "FechaPago").slice(0, 10), monto: num(at(s, "Monto")), forma: at(s, "FormaDePagoP") }; }) : [];
  var docs = tipo === "P" ? tags("DoctoRelacionado").map(function (s) { return { uuid: at(s, "IdDocumento").toUpperCase(), pagado: num(at(s, "ImpPagado")), saldo: num(at(s, "ImpSaldoInsoluto")), parcialidad: at(s, "NumParcialidad") }; }) : [];
  return {
    uuid: at(t, "UUID").toUpperCase(), version: at(c, "Version"), tipo: tipo, serie: at(c, "Serie"), folio: at(c, "Folio"),
    fecha: at(c, "Fecha").slice(0, 10), hora: at(c, "Fecha").slice(11, 16), timbrado: at(t, "FechaTimbrado"),
    emisorRfc: at(em, "Rfc").toUpperCase(), emisorNombre: at(em, "Nombre"), emisorRegimen: at(em, "RegimenFiscal"),
    receptorRfc: at(re, "Rfc").toUpperCase(), receptorNombre: at(re, "Nombre"), uso: at(re, "UsoCFDI"),
    moneda: at(c, "Moneda") || "MXN", tipoCambio: num(at(c, "TipoCambio")) || 1,
    subtotal: num(at(c, "SubTotal")), descuento: num(at(c, "Descuento")), total: num(at(c, "Total")),
    iva: Math.round(iva * 100) / 100, trasladados: num(at(imp, "TotalImpuestosTrasladados")), retenidos: num(at(imp, "TotalImpuestosRetenidos")),
    metodoPago: at(c, "MetodoPago"), formaPago: at(c, "FormaPago"),
    conceptos: tags("Concepto").slice(0, 60).map(function (s) { return { clave: at(s, "ClaveProdServ"), d: at(s, "Descripcion"), c: num(at(s, "Cantidad")), u: at(s, "ClaveUnidad") || at(s, "Unidad"), v: num(at(s, "ValorUnitario")), i: num(at(s, "Importe")) }; }),
    relacion: at(tags("CfdiRelacionados")[0], "TipoRelacion"), relacionados: tags("CfdiRelacionado").map(function (s) { return at(s, "UUID").toUpperCase(); }),
    pagos: pagos, pagados: docs
  };
}
var JASA_CFDI_TIPO = { I: "Ingreso", E: "Egreso (nota de crédito)", P: "Pago", N: "Nómina", T: "Traslado" };

/* ---------- vigencia de la recarga (NOM-154-SCFI-2005: servicio de mantenimiento y recarga anual) ---------- */
// Meses entre la última recarga y el vencimiento, por tipo. El vencimiento nunca se captura a mano.
var JASA_VIGENCIA = { PQS: 12, CO2: 12, "TIPO K": 12, AGUA: 12, AFFF: 12, "TIPO D": 12, "AGENTE LIMPIO": 12 };
function jasaMasMeses(k, n) {
  if (!/^\d{4}-\d{2}$/.test(String(k || ""))) return "";
  var y = +k.slice(0, 4), m = +k.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
  return y + "-" + String(m + 1).padStart(2, "0");
}
function jasaVence(recarga, tipo) { return jasaMasMeses(recarga, JASA_VIGENCIA[tipo] || 12); }
// Prueba hidrostática: cada 5 años (NOM-002-STPS-2010). Se captura la última; la próxima se calcula.
var JASA_VIGENCIA_PH = 60;
function jasaPhProxima(ultima) { return jasaMasMeses(ultima, JASA_VIGENCIA_PH); }
function jasaRecargaFutura(recarga) { var d = new Date(), hoy = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); return !!recarga && recarga > hoy; }
/*@/reporte*/
</script>
<script src="/config.js"></script>
<script>
(function(){
var IVA=jasaIva();
jasaEmpresaPintar();jasaEmpresaCargar(SUPA_URL,SUPA_KEY,function(){IVA=jasaIva();jasaEmpresaPintar();if(Q)render();});
var $=function(i){return document.getElementById(i);};
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function money(n){return "$"+(+n||0).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});}
function fd(s){if(!s)return "";var p=String(s).slice(0,10).split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:s;}
var token=(decodeURIComponent(location.pathname).split("/q/")[1]||"").split("/")[0];if(!token||/^index\.html?$/i.test(token))token=location.hash.slice(1);
token=token.replace(/[^A-Za-z0-9_-]/g,"");
function rpc(fn,body){return fetch(SUPA_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"apikey":SUPA_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j&&j.message||"error");return j;});});}
var Q=null;
function render(){
  var q=Q,lines=q.lines||[],sub=lines.reduce(function(a,l){return a+(parseFloat(l.price)||0)*(+l.qty||0);},0),tot=sub*(1+IVA);
  var aut=q.status==="Autorizada"||q.status==="Aceptada",rech=q.status==="Rechazada",missing=lines.some(function(l){return l.price===""||l.price==null;});
  var wa=jasaWaLink("Hola, tengo una duda sobre la cotización "+q.folio+" de "+q.cliente+".");
  $("out").innerHTML='<div class="card"><div class="head"><div><span class="eyebrow">Cotización '+esc(q.folio)+' · '+esc(fd(q.fecha))+'</span><h1>'+esc(q.cliente)+'</h1></div><span class="pill" style="color:'+(aut?"var(--green)":rech?"var(--red-2)":"var(--warn)")+'">'+(aut?"Autorizada":rech?"No vigente":"Por autorizar")+'</span></div>'+
    '<div class="meta">'+[["Dirigido a",q.dirigido],["Dirección",[q.direccion,q.ciudad].filter(Boolean).join(", ")],["Condiciones",q.cond],["Tiempo de entrega",q.entregaTxt],["Vigencia de precios",q.vigencia]].filter(function(m){return m[1];}).map(function(m){return '<div><span class="eyebrow">'+m[0]+'</span><span>'+esc(m[1])+'</span></div>';}).join("")+'</div>'+
    '<div class="tbl"><table><thead><tr><th>#</th><th>Concepto</th><th class="n">Cant.</th><th class="n">Precio unit.</th><th class="n">Importe</th></tr></thead><tbody>'+lines.map(function(l,i){var has=l.price!==""&&l.price!=null;return '<tr><td>'+(i+1)+'</td><td>'+esc(l.art)+'</td><td class="n">'+esc(l.qty)+'</td><td class="n">'+(has?money(l.price):"—")+'</td><td class="n">'+(has?money((parseFloat(l.price)||0)*(+l.qty||0)):"—")+'</td></tr>';}).join("")+'</tbody></table></div>'+
    '<div class="tot"><span class="s">Subtotal '+money(sub)+' · I.V.A. '+JASA_EMPRESA.iva+'% '+money(sub*IVA)+'</span><span class="big">'+money(tot)+'</span><span class="s">Precios en pesos mexicanos</span></div></div>'+
    (aut?'<div class="card"><div class="ok">Autorizada por '+esc((q.autorizo||{}).nombre||"el cliente")+((q.autorizo||{}).fecha?' el '+esc(fd(q.autorizo.fecha))+' a las '+esc(String(q.autorizo.fecha).slice(11,16)):"")+'. Ya nos llegó el aviso; te contactamos para programar el servicio.</div></div>'
    :rech?'<div class="card"><div class="form"><b>Esta cotización ya no está vigente.</b><span class="note">Escríbenos y te mandamos una nueva.</span><div class="btns"><a class="btn wa" target="_blank" rel="noopener" href="'+esc(wa)+'">Escribir por WhatsApp</a></div></div></div>'
    :missing?'<div class="card"><div class="form"><b>Estamos terminando tu cotización.</b><span class="note">Algunos precios todavía no están listos. Te avisamos en cuanto la completemos.</span></div></div>'
    :'<form class="card" id="autForm"><div class="form"><h2>Autorizar cotización</h2><span class="note">Al autorizar nos llega el aviso y te contactamos para programar la recolección o el servicio.</span>'+
      '<div class="field"><label for="aNom">Tu nombre</label><input class="inp" id="aNom" autocomplete="name" required value="'+esc(q.dirigido||"")+'"></div>'+
      '<div class="field"><label for="aCom">Comentarios (opcional)</label><textarea class="inp" id="aCom" placeholder="Ej. Pueden pasar el lunes por la mañana; preguntar por Laura"></textarea></div>'+
      '<div class="err" id="aErr" role="alert"></div><div class="btns"><button class="btn" type="submit" id="aBtn">Autorizar cotización</button><a class="btn wa" target="_blank" rel="noopener" href="'+esc(wa)+'">Tengo dudas</a></div></div></form>');
}
function aviso(q,nombre,com){
  try{var lines=q.lines||[],sub=lines.reduce(function(a,l){return a+(parseFloat(l.price)||0)*(+l.qty||0);},0);
    var body=new URLSearchParams({"form-name":"cotizacion-autorizada",subject:"Cotización autorizada "+q.folio+": "+q.cliente,folio:q.folio,cliente:q.cliente,autorizo:nombre,comentario:com||"",total:money(sub*(1+IVA)),ver_cotizacion:"https://jasaextintores.com/admin/#cotizacion-"+q.folio});
    fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body.toString()}).catch(function(){});}catch(e){}
}
document.addEventListener("submit",function(e){if(e.target.id!=="autForm")return;e.preventDefault();
  var n=$("aNom").value.trim(),c=$("aCom").value.trim(),b=$("aBtn");if(n.length<3){$("aErr").textContent="Escribe tu nombre para autorizar.";$("aNom").focus();return;}
  b.disabled=true;$("aErr").textContent="";
  rpc("autorizar_cotizacion",{token:token,nombre:n,comentario:c}).then(function(){aviso(Q,n,c);return rpc("cotizacion_publica",{token:token});}).then(function(q){Q=q;render();window.scrollTo(0,0);},
    function(err){b.disabled=false;$("aErr").textContent=(err&&err.message&&!/fetch|network/i.test(err.message)?err.message:"No se pudo enviar. Revisa tu conexión e inténtalo otra vez.");});});
if(token.length<20){$("out").innerHTML='<div class="card"><div class="form"><b>Este enlace no está completo.</b><span class="note">Ábrelo directo desde el mensaje que te mandamos, o escríbenos al '+esc(JASA_EMPRESA.wa)+'.</span></div></div>';return;}
rpc("cotizacion_publica",{token:token}).then(function(q){if(!q){$("out").innerHTML='<div class="card"><div class="form"><b>No encontramos esta cotización.</b><span class="note">Pide el enlace otra vez por WhatsApp al '+esc(JASA_EMPRESA.wa)+'.</span></div></div>';return;}Q=q;render();},
  function(){$("out").innerHTML='<div class="card"><div class="form"><b>No se pudo abrir la cotización.</b><span class="note">Revisa tu conexión y vuelve a intentar.</span></div></div>';});
})();
</script>
