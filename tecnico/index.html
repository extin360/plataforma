.brand{display:flex;align-items:baseline;gap:8px}

.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}

.err{color:var(--rose);font-size:14px;min-height:1.2em}
.hint{font-size:14px;color:var(--muted)}

.list{display:flex;flex-direction:column}

.ficha dt{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding-top:3px}
.ficha dd{margin:0}
.res{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:22px}
video{width:100%;border-radius:6px;background:#000;aspect-ratio:3/4;object-fit:cover}
.scanbox{position:relative}
.scanbox::after{content:"";position:absolute;inset:22% 14%;border:3px solid var(--red-2);border-radius:6px;pointer-events:none}
canvas.sig{width:100%;height:180px;background:#fff;border:1px solid var(--line-2);border-radius:6px;touch-action:none}
.dock{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line-2);box-shadow:0 -2px 8px rgba(26,23,22,.06);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.dock .wrap{display:flex;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--carbon);color:#ffffff;padding:10px 16px;border-radius:4px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* Folios: PREFIJO-NNN por cliente (ej. EAP1-001) o JX-000001 para etiquetas en blanco. */
function jasaFolio(txt) {
  var s = String(txt || "").toUpperCase().trim();
  var m = s.match(/\/E\/([A-Z0-9]{2,8})-(\d{1,6})/) || s.match(/^([A-Z0-9]{2,8})-(\d{1,6})$/) || s.match(/\b(JX)-?(\d{1,6})\b/);
  if (!m) return "";
  return m[1] + "-" + m[2].padStart(m[1] === "JX" ? 6 : 3, "0");
}
function jasaPrefijo(nombre) {
  var stop = { DE: 1, DEL: 1, LA: 1, LAS: 1, LOS: 1, EL: 1, Y: 1, SA: 1, CV: 1, "S.A.": 1, "C.V.": 1, SAPI: 1, SC: 0 };
  var w = String(nombre || "").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Z0-9 ]+/g, " ").split(/\s+/).filter(function (x) { return x && !stop[x]; });
  var dig = w.filter(function (x) { return /^\d+$/.test(x); }).join("").slice(0, 2), pal = w.filter(function (x) { return !/^\d+$/.test(x); });
  var p = pal.length >= 2 ? pal.slice(0, 3).map(function (x) { return x[0]; }).join("") : (pal[0] || "CLI").slice(0, 3);
  return (p + dig).slice(0, 6) || "CLI";
}

/* Hallazgos de una inspección, agrupados para cotizar. */
var JASA_CATS = ["Mantenimiento y recarga", "Reparaciones", "Señalamientos", "Accesorios"];
function jasaHallazgos(items, hoyMes) {
  var map = {}, out = [];
  function add(cat, art) { var k = cat + "|" + art; if (!map[k]) { map[k] = { cat: cat, art: art, qty: 0 }; out.push(map[k]); } map[k].qty++; }
  (items || []).forEach(function (i) {
    var t = i.tipo === "CO2" ? "CO2" : (i.tipo || "PQS"), cap = String(i.cap || "").toUpperCase(), eq = (cap + " " + t).trim(), p = i.puntos || {}, ch = (i.chips || []).join(" ") + " " + (i.nota || "");
    if (i.vencido || /recarga|vencido|despresurizado/i.test(ch)) add(JASA_CATS[0], "RECARGA DE EXTINTOR " + eq);
    if (i.ph && i.ph < hoyMes) add(JASA_CATS[0], "PRUEBA HIDROSTÁTICA DE EXTINTOR " + eq);
    if (p.recipiente === "mal" || p.pintura === "mal" || /golpeado/i.test(ch)) add(JASA_CATS[0], "MANTENIMIENTO Y PINTURA DE EXTINTOR " + eq);
    if (p.manguera === "mal" || /manguera/i.test(ch)) add(JASA_CATS[1], "CAMBIO DE MANGUERA DE EXTINTOR " + eq);
    if (p.corneta === "mal") add(JASA_CATS[1], "CAMBIO DE CORNETA O DIFUSOR " + eq);
    if (p.manometro === "mal") add(JASA_CATS[1], "CAMBIO DE MANÓMETRO DE EXTINTOR " + eq);
    if (p.valvula === "mal") add(JASA_CATS[1], "MANTENIMIENTO DE VÁLVULA DE EXTINTOR " + eq);
    if (p.seguro === "mal" || p.sello === "mal" || /seguro/i.test(ch)) add(JASA_CATS[1], "SEGURO Y SELLO DE EXTINTOR");
    if (p.letrero === "no" || /señalamiento/i.test(ch)) add(JASA_CATS[2], "SEÑALAMIENTO DE EXTINTOR");
    if (p.portamanguera === "mal") add(JASA_CATS[3], "PORTAMANGUERA DE EXTINTOR");
    if (p.pedestal === "no") add(JASA_CATS[3], "PEDESTAL PARA EXTINTOR");
    if (p.soporte === "mal") add(JASA_CATS[3], "SOPORTE DE PARED PARA EXTINTOR");
  });
  return out.sort(function (a, b) { return JASA_CATS.indexOf(a.cat) - JASA_CATS.indexOf(b.cat); });
}

/* ---------- cámara y QR ---------- */
var raf=null;
function startCam(){
  var vid=$("vid"),cv=$("cv"),msg=$("scanMsg");if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg.textContent="Este navegador no permite usar la cámara. Escribe el folio abajo.";return;}
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}).then(function(st){
    S.stream=st;vid.srcObject=st;vid.play();var ctx=cv.getContext("2d",{willReadFrequently:true}),last=0;
    var tick=function(ts){if(!S.stream)return;raf=requestAnimationFrame(tick);if(ts-last<180||vid.readyState<2)return;last=ts;
      var w=vid.videoWidth,h=vid.videoHeight,sc=Math.min(1,640/Math.max(w,h));cv.width=w*sc;cv.height=h*sc;ctx.drawImage(vid,0,0,cv.width,cv.height);
      var img=ctx.getImageData(0,0,cv.width,cv.height),code=window.jsQR(img.data,img.width,img.height,{inversionAttempts:"dontInvert"});
      if(code&&code.data){var m=jasaFolio(code.data);if(m){if(navigator.vibrate)navigator.vibrate(60);stopCam();openItem(m);}else msg.textContent="Ese QR no es de una etiqueta de JASA.";}};
    raf=requestAnimationFrame(tick);
  },function(){msg.textContent="No se pudo abrir la cámara. Da permiso a la cámara en el navegador o escribe el folio abajo.";});
}
function stopCam(){if(raf)cancelAnimationFrame(raf);raf=null;if(S.stream){S.stream.getTracks().forEach(function(t){t.stop();});S.stream=null;}}

var sigUsed=false;
function initSig(){var c=$("sig");if(!c)return;sigUsed=false;var r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;var x=c.getContext("2d");x.scale(2,2);x.lineWidth=2.4;x.lineCap="round";x.strokeStyle="#111";var on=false;
  function pos(e){var b=c.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top];}
  c.addEventListener("pointerdown",function(e){on=true;sigUsed=true;c.setPointerCapture(e.pointerId);var p=pos(e);x.beginPath();x.moveTo(p[0],p[1]);});
  c.addEventListener("pointermove",function(e){if(!on)return;var p=pos(e);x.lineTo(p[0],p[1]);x.stroke();});
  c.addEventListener("pointerup",function(){on=false;});}

/* ---------- eventos ---------- */
document.addEventListener("click",function(e){var b=e.target.closest("[data-act]");if(!b)return;var a=b.getAttribute("data-act");
  if(a==="logout"){sb.auth.signOut().then(function(){location.reload();});return;}
  if(a==="resume"||a==="backVisit"){S.view="visit";render();return;}
  if(a==="scan"){S.manual=false;S.view="scan";render();return;}
  if(a==="firma"){S.view="firma";render();return;}
  if(a==="verOrden"){S.ordenSel=b.getAttribute("data-id");S.view="orden";render();return;}
  if(a==="aRuta"||a==="quitarRuta"){var oo=S.ordenes.find(function(x){return x.id===S.ordenSel;});if(oo){saveOrden(oo,{enRuta:a==="aRuta"?today():""});toast(a==="aRuta"?"Agregada a tu ruta de hoy":"Quitada de tu ruta");render();}return;}
  if(a==="recogido"){var orx=S.ordenes.find(function(x){return x.id===S.ordenSel;});if(!orx)return;if(!window.confirm("¿Ya recogiste los equipos de "+orx.cliente+"? La orden pasa a Recibido en el taller."))return;saveOrden(orx,{etapa:1,etapaV:2,recogido:new Date().toISOString(),recogio:S.nombre||String(S.user.email).split("@")[0],enRuta:""});toast("Listo: la orden "+orx.folio+" pasó a Recibido");S.view="home";render();return;}
  if(a==="firmaSave"){firmaSave();return;}
  if(a==="startVis"&&!S.miFirma){toast("Primero agrega tu firma: va en tus reportes.");S.view="firma";render();return;}
  if(a==="startVis"){var vx=S.visitas.find(function(y){return y.id===b.getAttribute("data-id");});if(!vx)return;var cl=findCli(vx.cliente)||{};
    S.cur={id:vx.inspeccion||rid(),cliente:cl.nombre||vx.cliente,fecha:today(),reviso:load(KR,"")||S.nombre||String(S.user.email).split("@")[0],responsable:cl.contacto||"",items:{},estado:"en curso",visita:vx.id,creado:Date.now()};
    saveVisit();saveVisita(vx.id,{estado:"en curso",inspeccion:S.cur.id});S.view="visit";render();return;}
  if(a==="altaNueva"){var f=nextFolio(visit().cliente);if(!openItem(f))return;S.draft.nueva=true;toast("Folio "+f+" asignado. La etiqueta se imprime en la oficina.");return;}
  if(a==="manual"){S.manual=true;S.view="scan";render();setTimeout(function(){var f=$("ffFolio");if(f)f.focus();},50);return;}
  if(a==="back"){S.view=visit()?"visit":"home";render();return;}
  if(a==="open"){openItem(b.getAttribute("data-f"));return;}
  if(a==="pt"){readForm();S.draft.puntos[b.getAttribute("data-k")]=b.getAttribute("data-v");var y=window.scrollY;render();window.scrollTo(0,y);return;}
  if(a==="chip"){readForm();var c=b.getAttribute("data-v"),i=S.draft.chips.indexOf(c);if(i>=0)S.draft.chips.splice(i,1);else S.draft.chips.push(c);var y2=window.scrollY;render();window.scrollTo(0,y2);return;}
  if(a==="saveItem"){saveItem();return;}
  if(a==="finishAsk"){S.view="finish";render();return;}
  if(a==="sigClear"){if(S.view==="firma"){var cv=$("sig");cv.getContext("2d").clearRect(0,0,cv.width,cv.height);sigUsed=false;return;}render();return;}
  if(a==="finishDo"){finish();return;}
  if(a==="home"){S.view="home";render();return;}
});
document.addEventListener("change",function(e){if(e.target.id==="fTipo"){readForm();var y0=window.scrollY;render();window.scrollTo(0,y0);return;}if(e.target.id==="fRet"){readForm();var y=window.scrollY;render();window.scrollTo(0,y);}});
document.addEventListener("submit",function(e){e.preventDefault();var f=e.target;
  if(f.id==="loginForm"){$("lgErr").textContent="Entrando…";sb.auth.signInWithPassword({email:$("lgMail").value.trim(),password:$("lgPass").value}).then(function(r){if(r.error){$("lgErr").textContent=/invalid/i.test(r.error.message)?"Correo o contraseña incorrectos.":"No se pudo entrar: "+r.error.message;return;}boot();});return;}
  if(f.id==="newForm"){var cli=$("nfCli").value.trim();if(!cli){toast("Elige el cliente.");return;}var rev=$("nfRev").value.trim();save(KR,rev);
    S.cur={id:rid(),cliente:(S.clientes.find(function(x){return String(x.nombre).trim().toLowerCase()===cli.toLowerCase();})||{nombre:cli}).nombre,fecha:today(),reviso:rev,responsable:$("nfResp").value.trim(),items:{},estado:"en curso",creado:Date.now()};
    saveVisit();S.view="visit";render();return;}
  if(f.id==="folioForm"){openItem($("ffFolio").value);return;}
});

/* ---------- arranque ---------- */
function boot(){
  sb.auth.getSession().then(function(r){var ses=r&&r.data&&r.data.session;if(!ses){S.view="login";render();return;}
    S.user=ses.user;return sb.from("staff").select("*").then(function(q){
      var yo=(q.data||[]).find(function(x){return String(x.email).toLowerCase()===String(ses.user.email).toLowerCase();});if(yo){S.rol=yo.rol||"admin";S.nombre=yo.nombre||"";save("jasaYo",{rol:S.rol,nombre:S.nombre});
        if(S.rol!=="admin"&&S.rol!=="tecnico"&&(yo.permisos||[]).indexOf("campo")<0){S.view="login";render();$("lgErr").textContent="Tu usuario no tiene permiso para la app del técnico. Pídelo en Personal y permisos del panel.";sb.auth.signOut();return;}}
      if(!q.error&&!yo){sb.auth.signOut();S.view="login";render();$("lgErr").textContent="Tu correo no tiene acceso. Pide que te agreguen al personal.";return;}
      return loadData().then(function(){S.view=visit()&&visit().estado==="en curso"?"visit":"home";render();flush();
        var ho=decodeURIComponent(location.hash.slice(1)).match(/^orden-(.+)$/i);if(ho){var oh=S.ordenes.find(function(x){return String(x.folio).toUpperCase()===ho[1].toUpperCase();});try{history.replaceState(null,"",location.pathname);}catch(e){}if(oh){S.ordenSel=oh.id;S.view="orden";render();}else toast("No encontré la orden "+ho[1]+". Pide que te la asignen.");return;}
        var hm=jasaFolio(decodeURIComponent(location.hash.slice(1)));if(hm){try{history.replaceState(null,"",location.pathname);}catch(e){}if(visit()&&visit().estado==="en curso")openItem(hm);else toast("Empieza o continúa una inspección para revisar "+hm+".");}});
    },function(){var c=load("jasaCache",null);if(c){S.clientes=c.clientes;S.ext=c.ext;S.visitas=c.visitas||[];S.ordenes=c.ordenes||[];}var me=load("jasaYo",null);if(me){S.rol=me.rol;S.nombre=me.nombre;}S.view=visit()?"visit":"home";render();});
  });
}
boot();
})();
</script>
