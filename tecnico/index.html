.q-sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}

.q-sum-i b{font-weight:700;white-space:nowrap}.q-sum-i.ok b{color:var(--green)}.q-sum-i.bad{border-color:var(--red);background:#fde8e6}.q-sum-i.bad b{color:var(--rose)}
@media (min-width:700px){.q-card{min-height:0;padding:32px}.q-btn{min-height:130px}}
.res{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:22px}
video{width:100%;border-radius:6px;background:#000;aspect-ratio:3/4;object-fit:cover}
.scanbox{position:relative}
.scanbox::after{content:"";position:absolute;inset:22% 14%;border:3px solid var(--red-2);border-radius:6px;pointer-events:none}
canvas.sig{width:100%;height:180px;background:#fff;border:1px solid var(--line-2);border-radius:6px;touch-action:none}
.dock{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line-2);box-shadow:0 -2px 8px rgba(26,23,22,.06);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.dock .wrap{display:flex;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--carbon);color:#ffffff;padding:10px 16px;border-radius:4px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    while ((mt = rt.exec(sec))) if (at(mt[1], "Impuesto") === "002") iva += num(at(mt[1], "Importe")); }

    iva: Math.round(iva * 100) / 100, trasladados: num(at(imp, "TotalImpuestosTrasladados")), retenidos: num(at(imp, "TotalImpuestosRetenidos")),

    relacion: at(tags("CfdiRelacionados")[0], "TipoRelacion"), relacionados: tags("CfdiRelacionado").map(function (s) { return at(s, "UUID").toUpperCase(); }),

  if(a==="open"){openItem(b.getAttribute("data-f"));return;}
  if(a==="ans"){var dd=S.draft;dd.puntos[b.getAttribute("data-k")]=b.getAttribute("data-v");if(navigator.vibrate)navigator.vibrate(15);var nq=qList(dd).length,nx=dd.step+1;while(nx<nq&&dd.puntos[qList(dd)[nx].k]&&dd.stepFwd)nx++;dd.step=nx;render();window.scrollTo(0,0);return;}
  if(a==="qPrev"){readForm();var dp=S.draft;dp.step=Math.max(dp.step>=qList(dp).length?qList(dp).length-1:dp.step-1,-1);if(dp.step===-1&&S.ext[dp.folio]&&S.ext[dp.folio].estado&&S.ext[dp.folio].estado!=="sin asignar"&&!dp.datosEdit)dp.step=0;render();window.scrollTo(0,0);return;}
  if(a==="qDatos"){readForm();S.draft.datosEdit=true;S.draft.backStep=S.draft.step;S.draft.step=-1;render();window.scrollTo(0,0);return;}
  if(a==="qDatosOk"){readForm();var dk=S.draft;if(!dk.ubicacion){toast("Escribe la ubicación del extintor.");return;}if(!dk.cap){toast("Escribe la capacidad.");return;}dk.datosOk=true;dk.step=dk.datosEdit&&dk.backStep!=null?dk.backStep:0;dk.datosEdit=false;render();window.scrollTo(0,0);return;}
  if(a==="allOk"){var da=S.draft;qList(da).forEach(function(z){if(!da.puntos[z.k])da.puntos[z.k]=z.o[0];});da.step=qList(da).length;render();window.scrollTo(0,0);return;}
  if(a==="goStep"){readForm();S.draft.step=+b.getAttribute("data-v");render();window.scrollTo(0,0);return;}
  if(a==="pt"){readForm();S.draft.puntos[b.getAttribute("data-k")]=b.getAttribute("data-v");var y=window.scrollY;render();window.scrollTo(0,y);return;}
  if(a==="chip"){readForm();var c=b.getAttribute("data-v"),i=S.draft.chips.indexOf(c);if(i>=0)S.draft.chips.splice(i,1);else S.draft.chips.push(c);var y2=window.scrollY;render();window.scrollTo(0,y2);return;}
  if(a==="saveItem"){saveItem();return;}
  if(a==="finishAsk"){S.view="finish";render();return;}
  if(a==="sigClear"){if(S.view==="firma"){var cv=$("sig");cv.getContext("2d").clearRect(0,0,cv.width,cv.height);sigUsed=false;return;}render();return;}
  if(a==="finishDo"){finish();return;}
  if(a==="home"){S.view="home";render();return;}
});
document.addEventListener("input",function(e){if(e.target.id==="cliQ"){S.cliQ=e.target.value;var l=$("cliList");if(l)l.innerHTML=cliRows(S.cliQ);}});
document.addEventListener("change",function(e){if(e.target.id==="fTipo"){readForm();S.draft.capOtra=false;S.draft.cap="";var y0=window.scrollY;render();window.scrollTo(0,y0);return;}if(e.target.id==="fRet"){readForm();var y=window.scrollY;render();window.scrollTo(0,y);}});
document.addEventListener("submit",function(e){e.preventDefault();var f=e.target;
  if(f.id==="loginForm"){$("lgErr").textContent="Entrando…";sb.auth.signInWithPassword({email:$("lgMail").value.trim(),password:$("lgPass").value}).then(function(r){if(r.error){$("lgErr").textContent=/invalid/i.test(r.error.message)?"Correo o contraseña incorrectos.":"No se pudo entrar: "+r.error.message;return;}boot();});return;}
  if(f.id==="newForm"){var cli=S.nfCli?S.nfCli.nombre:"";if(!cli){toast("Elige el cliente.");return;}S.nfCli=null;var rev=$("nfRev").value.trim();save(KR,rev);
    S.cur={id:rid(),cliente:(S.clientes.find(function(x){return String(x.nombre).trim().toLowerCase()===cli.toLowerCase();})||{nombre:cli}).nombre,fecha:today(),reviso:rev,responsable:$("nfResp").value.trim(),items:{},estado:"en curso",creado:Date.now()};
    saveVisit();S.view="visit";render();return;}
  if(f.id==="folioForm"){openItem($("ffFolio").value);return;}
});

/* ---------- arranque ---------- */
var lastLoad=0;
function refrescar(manual){if(!S.user||!navigator.onLine)return;if(!manual&&Date.now()-lastLoad<30000)return;if(["form","finish","firma","scan"].indexOf(S.view)>=0)return;lastLoad=Date.now();
  loadData().then(function(){if(["home","orden","visit"].indexOf(S.view)>=0){var y=window.scrollY;render();window.scrollTo(0,y);}if(manual)toast("Actualizado");});}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")refrescar(false);});
window.addEventListener("online",function(){refrescar(false);});
function boot(){
  sb.auth.getSession().then(function(r){var ses=r&&r.data&&r.data.session;if(!ses){S.view="login";render();if(RECOVERY){RECOVERY=false;$("lgErr").textContent="El enlace para cambiar tu contraseña ya no es válido. Pide otro con ¿Olvidaste tu contraseña?";}return;}
    if(RECOVERY){RECOVERY=false;dock("");$("app").innerHTML='<div class="card">'+passForm()+'</div>';$("npForm").addEventListener("submit",function(e){e.preventDefault();e.stopImmediatePropagation();savePass(sb,function(){toast("Contraseña guardada");boot();});});return;}
    S.user=ses.user;return sb.from("staff").select("*").then(function(q){
      var yo=(q.data||[]).find(function(x){return String(x.email).toLowerCase()===String(ses.user.email).toLowerCase();});if(yo){S.rol=yo.rol||"admin";S.nombre=yo.nombre||"";save("jasaYo",{rol:S.rol,nombre:S.nombre});
        S.soloAsist=S.rol!=="admin"&&S.rol!=="tecnico"&&(yo.permisos||[]).indexOf("campo")<0;}
      if(!q.error&&!yo){sb.auth.signOut();S.view="login";render();$("lgErr").textContent="Tu correo no tiene acceso. Pide que te agreguen al personal.";return;}
      return loadData().then(function(){lastLoad=Date.now();S.view=visit()&&visit().estado==="en curso"?"visit":"home";render();flush();
        var ho=decodeURIComponent(location.hash.slice(1)).match(/^orden-(.+)$/i);if(ho){var oh=S.ordenes.find(function(x){return String(x.folio).toUpperCase()===ho[1].toUpperCase();});try{history.replaceState(null,"",location.pathname);}catch(e){}if(oh){S.ordenSel=oh.id;S.view="orden";render();}else toast("No encontré la orden "+ho[1]+". Pide que te la asignen.");return;}
        var hm=jasaFolio(decodeURIComponent(location.hash.slice(1)));if(hm){try{history.replaceState(null,"",location.pathname);}catch(e){}if(visit()&&visit().estado==="en curso")openItem(hm);else toast("Empieza o continúa una inspección para revisar "+hm+".");}});
    },function(){var c=load("jasaCache",null);if(c){S.clientes=c.clientes;S.ext=c.ext;S.visitas=c.visitas||[];S.ordenes=c.ordenes||[];}var me=load("jasaYo",null);if(me){S.rol=me.rol;S.nombre=me.nombre;}S.view=visit()?"visit":"home";render();});
  });
}
boot();
})();
</script>
