# Las páginas se publican tal cual (no hay build). Solo las funciones usan dependencias de npm.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/app"
  to   = "/app/index.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to   = "/app/index.html"
  status = 200
